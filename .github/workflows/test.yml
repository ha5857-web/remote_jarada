name: 자동 시험
on:
  push:
    branches: [main, flow-report-swap-fix]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: 시험 도구 설치
        working-directory: tests
        run: |
          npm ci
          # 글꼴 등 시스템 꾸러미까지 설치(가끔 우분투 저장소 접속이 끊겨서 3번까지 다시 시도). 끝내 안 되면 브라우저만 설치합니다.
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "다시 시도 $i"; sleep 20; done
          npx playwright install chromium
      - name: 시험 실행
        working-directory: tests
        run: npm test
      - name: 실패했을 때 화면 사진 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/out
          if-no-files-found: ignore
