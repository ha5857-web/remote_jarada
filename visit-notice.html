<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 자라다케어 보안 연동: 서버에 로그인 토큰을 자동으로 붙이고, 필요하면 비밀번호를 한 번 묻습니다 -->
<script>
(function () {
  var KEY = 'jrd_auth_token';
  var raw = window.fetch.bind(window);
  var isApi = function (u) { return typeof u === 'string' && u.indexOf('script.google.com/macros/') !== -1; };
  var loginInFlight = null;

  function attach(url, opts, token) {
    var o = Object.assign({}, opts || {});
    var method = (o.method || 'GET').toUpperCase();
    if (!token) return [url, o];
    if (method === 'GET') {
      url += (url.indexOf('?') !== -1 ? '&' : '?') + 'auth=' + encodeURIComponent(token);
    } else if (typeof o.body === 'string') {
      try { var b = JSON.parse(o.body); b.auth = token; o.body = JSON.stringify(b); } catch (e) {}
    }
    return [url, o];
  }

  function askLogin(apiUrl) {
    if (loginInFlight) return loginInFlight;
    loginInFlight = (async function () {
      var base = apiUrl.split('?')[0];
      for (var i = 0; i < 3; i++) {
        var pw = window.prompt('자라다케어 보안 로그인\n원무과 비밀번호를 입력해주세요.');
        if (pw === null) return null;
        try {
          var r = await raw(base, { method: 'POST', body: JSON.stringify({ action: 'login', password: pw }) });
          var j = await r.json();
          if (j && j.token) { localStorage.setItem(KEY, j.token); return j.token; }
          window.alert((j && j.message) || '비밀번호가 올바르지 않습니다.');
        } catch (e) { window.alert('서버에 연결할 수 없습니다.'); return null; }
      }
      return null;
    })();
    return loginInFlight.finally(function () { loginInFlight = null; });
  }

  window.fetch = async function (url, opts) {
    if (!isApi(url)) return raw(url, opts);

    // 앱 자체 로그인 요청: 그대로 보내고, 응답에 토큰이 있으면 저장
    var body = null;
    try { if (opts && typeof opts.body === 'string') body = JSON.parse(opts.body); } catch (e) {}
    if (body && body.action === 'login') {
      var lr = await raw(url, opts);
      try { var lj = await lr.clone().json(); if (lj && lj.token) localStorage.setItem(KEY, lj.token); } catch (e) {}
      return lr;
    }

    var a = attach(url, opts, localStorage.getItem(KEY));
    var res = await raw(a[0], a[1]);
    var j = null;
    try { j = await res.clone().json(); } catch (e) {}
    if (j && !Array.isArray(j) && j.code === 'AUTH_REQUIRED') {
      localStorage.removeItem(KEY);
      var t = await askLogin(url);
      if (t) { a = attach(url, opts, t); res = await raw(a[0], a[1]); }
    }
    return res;
  };

  // 필요하면 콘솔에서 jrdLogout() 로 토큰을 지울 수 있습니다.
  window.jrdLogout = function () { localStorage.removeItem(KEY); };
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>다음 내원일 안내 · 삼성자라다</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="manifest" href="manifest-doctor.json">
<meta name="theme-color" content="#1B3A4B">
<style>
:root{
  --primary:#1B3A4B; --accent:#C0902C; --secondary:#43555F;
  --light:#FBF8F1; --border:#DED5C6; --ok:#2E8B57; --danger:#C0392B;
  --radius:12px;
}
*{ box-sizing:border-box; }
body{ font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--light); color:var(--primary); margin:0; padding:16px; max-width:560px; margin-left:auto; margin-right:auto; }
header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
header h1{ font-size:17px; font-weight:800; }
header button{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:16px; cursor:pointer; }
.cal-box{ background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 10px; margin-bottom:16px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; font-weight:700; color:var(--secondary); margin-bottom:5px; }
.field input, .field textarea, .field select{
  width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; color:var(--primary); background:#fff;
}
.field textarea{ min-height:64px; resize:vertical; line-height:1.5; }
.choice-row{ display:flex; gap:8px; }
.choice-row.wrap{ flex-wrap:wrap; }
.choice-btn{ padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; background:#fff; color:var(--primary); font-size:12.5px; font-weight:600; cursor:pointer; }
.choice-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
.tpl-btn{ font-size:11.5px; padding:6px 10px; border:1.5px solid var(--border); border-radius:8px; background:#fff; color:var(--primary); cursor:pointer; font-weight:600; }
.tpl-btn.used{ background:var(--primary); color:#fff; border-color:var(--primary); }
.btn{ border:none; border-radius:9px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-block{ width:100%; }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-outline{ background:#fff; border:1px solid var(--border); color:var(--primary); }
.section-title{ font-size:14px; font-weight:800; margin-bottom:8px; }
.empty-note{ font-size:12px; color:var(--secondary); padding:10px 0; }
.modal-ov{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:center; justify-content:center; }
.modal-ov.open{ display:flex; }
.modal{ background:#fff; border-radius:14px; padding:20px; width:90%; max-width:400px; }
</style>
</head>
<body>

<header>
  <h1>📅 다음 내원일 안내</h1>
  <button onclick="openSettings()">⚙️</button>
</header>

<div class="cal-box">
  <div style="text-align:center;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--secondary);">삼성자라다소아청소년과 · 원무과 전용</div>
  </div>

  <div class="field"><label>환자명 *</label><input type="text" id="an_name" placeholder="홍길동"></div>

  <div class="field">
    <label>다음 내원 예정일 *</label>
    <input type="text" inputmode="numeric" id="an_date_quick" placeholder="숫자만 쭉 입력 (예: 20260701)" maxlength="10" style="margin-bottom:6px;">
    <input type="date" id="an_date">
  </div>

  <div class="field">
    <label>내원 시간 (선택)</label>
    <div class="choice-row" style="align-items:center;">
      <button type="button" class="choice-btn active" id="an_timeNone" style="flex:0 0 auto;" onclick="toggleApptTimeNone()">미정</button>
      <div id="an_timeWrap" style="display:none;align-items:center;gap:6px;flex:1;">
        <select id="an_hour" style="flex:0 0 70px;"></select>
        <span>:</span>
        <select id="an_min" style="flex:0 0 70px;"></select>
      </div>
    </div>
  </div>

  <div class="field">
    <label>검사 예정 (선택)</label>
    <div class="choice-row wrap" id="an_tests">
      <button type="button" class="choice-btn" data-multi="1" data-val="혈액검사">🔬 혈액검사</button>
    <button type="button" class="choice-btn" data-multi="1" data-val="공복필요">🍽️ 공복 필요</button>
    </div>
  </div>

  <div class="field">
    <label>추가 안내 사항 (클릭하여 추가)</label>
    <div class="choice-row wrap" id="an_templates" style="margin-bottom:8px;">
        <button type="button" class="tpl-btn" id="an_introFormBtn" onclick="addApptMemo(this)" data-text="초진 기록지를 미리 작성해 오시면 진료가 빨라집니다: https://docs.google.com/forms/d/1Hc7SZopDnP_pIFOKJgGRFU2W0IOEymEU7tVHybqRNok/edit">📝 초진 기록지 작성</button>
    </div>
    <textarea id="an_memo" rows="3" placeholder="위 버튼을 클릭하면 자동으로 추가됩니다. 직접 입력도 가능합니다."></textarea>
    <div style="text-align:right;margin-top:2px;">
      <span onclick="document.getElementById('an_memo').value='';resetApptMemoButtons();" style="font-size:11px;color:var(--secondary);cursor:pointer;text-decoration:underline;">전체 지우기</span>
    </div>
  </div>

  <div class="field"><label>보호자 전화번호 *</label><input type="text" id="an_phone" placeholder="010-0000-0000"></div>

  <button type="button" class="btn btn-primary btn-block" onclick="previewApptMsg()">👁️ 미리보기</button>
</div>

<div class="cal-box" id="an_previewBox" style="display:none;">
  <div class="section-title">📱 문자 미리보기</div>
  <textarea id="an_msgOutput" rows="10" style="width:100%;font-family:monospace;font-size:12px;line-height:1.6;"></textarea>
  <div style="display:flex;gap:8px;margin-top:8px;">
    <button type="button" class="btn btn-outline" style="flex:1;" onclick="copyApptMsg()">📋 복사</button>
    <button type="button" class="btn btn-primary" style="flex:1;" id="an_sendBtn" onclick="sendApptMsg()">🚀 즉시 발송</button>
  </div>
  <div id="an_sendStatus" style="font-size:11px;margin-top:6px;"></div>
</div>

<div class="cal-box">
  <div class="section-title">🕓 최근 발송 내역 (의사 앱과 공유)</div>
  <div id="an_history"></div>
</div>

<!-- 설정: 백엔드 URL -->
<div class="modal-ov" id="settingsOv" onclick="if(event.target.id==='settingsOv') closeSettings()">
  <div class="modal">
    <div class="section-title">⚙️ 연동 설정</div>
    <div class="field"><label>백엔드 URL (Apps Script 웹앱 주소)</label><input type="text" id="cfgApiUrl" placeholder="https://script.google.com/macros/s/..."></div>
    <button class="btn btn-primary btn-block" onclick="saveSettings()">저장</button>
  </div>
</div>

<script>
const NAVER_RESERVATION_URL = 'https://map.naver.com/p/entry/place/2075175246?placePath=%2Fhome&c=15.00,0,0,0,dh';
const INTAKE_FORM_URL = 'https://docs.google.com/forms/d/1Hc7SZopDnP_pIFOKJgGRFU2W0IOEymEU7tVHybqRNok/edit'; // TODO: '보내기'로 받은 실제 공유 링크(.../viewform)로 교체 필요

function getApiUrl(){ return localStorage.getItem('jrd_api_url') || ''; }
function openSettings(){
  document.getElementById('cfgApiUrl').value = getApiUrl();
  document.getElementById('settingsOv').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsOv').classList.remove('open'); }
function saveSettings(){
  const v = document.getElementById('cfgApiUrl').value.trim();
  localStorage.setItem('jrd_api_url', v);
  closeSettings();
  renderApptHistory();
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - new Date(ts).getTime();
  const min = Math.floor(diff/60000);
  if(min < 1) return '방금';
  if(min < 60) return `${min}분 전`;
  const hr = Math.floor(min/60);
  if(hr < 24) return `${hr}시간 전`;
  return `${Math.floor(hr/24)}일 전`;
}
function getMultiChoiceGroup(groupId){
  const group = document.getElementById(groupId);
  if(!group) return [];
  return Array.from(group.querySelectorAll('.choice-btn.active')).map(b=>b.dataset.val);
}
// choice-btn (data-multi="1") 토글: 클릭할 때마다 active 상태를 바꿔서 여러 개 선택 가능하게 합니다.
document.addEventListener('click', e=>{
  const btn = e.target.closest('.choice-btn');
  if(btn && btn.dataset.multi==='1') btn.classList.toggle('active');
});

// 일반 날짜 입력을 숫자로 빠르게 채우는 도우미
function attachQuickDateInput(quickId, targetId){
  const quick = document.getElementById(quickId);
  if(!quick) return;
  quick.addEventListener('input', ()=>{
    const digits = quick.value.replace(/\D/g,'').slice(0,8);
    let formatted = digits;
    if(digits.length > 4) formatted = digits.slice(0,4) + '-' + digits.slice(4,6) + (digits.length>6 ? '-'+digits.slice(6,8) : '');
    quick.value = formatted;
    if(digits.length === 8){
      const y = digits.slice(0,4), m = digits.slice(4,6), d = digits.slice(6,8);
      const test = new Date(`${y}-${m}-${d}T00:00:00`);
      if(!isNaN(test) && Number(m)>=1 && Number(m)<=12 && Number(d)>=1 && Number(d)<=31){
        document.getElementById(targetId).value = `${y}-${m}-${d}`;
      }
    }
  });
}
attachQuickDateInput('an_date_quick', 'an_date');

(function initApptTimeSelects(){
  const hourSel = document.getElementById('an_hour');
  const minSel = document.getElementById('an_min');
  for(let h=9; h<=20; h++) hourSel.innerHTML += `<option value="${h}">${String(h).padStart(2,'0')}시</option>`;
  for(let m=0; m<60; m+=10) minSel.innerHTML += `<option value="${m}">${String(m).padStart(2,'0')}분</option>`;
})();
function toggleApptTimeNone(){
  const btn = document.getElementById('an_timeNone');
  const wrap = document.getElementById('an_timeWrap');
  const isNone = !btn.classList.contains('active');
  btn.classList.toggle('active', isNone);
  wrap.style.display = isNone ? 'none' : 'flex';
}
function addApptMemo(btn){
  const text = btn.dataset.text;
  const memo = document.getElementById('an_memo');
  if(btn.classList.contains('used')){
    let current = memo.value;
    if(current.trim()===text.trim()) current = '';
    else if(current.includes('\n'+text)) current = current.replace('\n'+text, '');
    else if(current.startsWith(text)) current = current.slice(text.length).replace(/^\n/, '');
    else if(current.includes(text)) current = current.replace(text, '');
    memo.value = current.trim();
    btn.classList.remove('used');
  } else {
    if(memo.value.trim()) memo.value += '\n';
    memo.value += text;
    btn.classList.add('used');
  }
}
function resetApptMemoButtons(){
  document.querySelectorAll('#an_templates .tpl-btn').forEach(b=>b.classList.remove('used'));
}
function formatDateKr(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일(${days[d.getDay()]})`;
}
function previewApptMsg(){
  const name = document.getElementById('an_name').value.trim();
  const dateVal = document.getElementById('an_date').value;
  if(!name){ alert('환자명을 입력해주세요.'); return; }
  if(!dateVal){ alert('다음 내원 예정일을 선택해주세요.'); return; }

  const dateKr = formatDateKr(dateVal);
  const isTimeNone = document.getElementById('an_timeNone').classList.contains('active');
  let timeStr = '';
  if(!isTimeNone){
    const h = parseInt(document.getElementById('an_hour').value||'9');
    const m = document.getElementById('an_min').value||'0';
    const ampm = h < 12 ? '오전' : '오후';
    const h12 = h > 12 ? h-12 : h;
    timeStr = `${ampm} ${h12}시` + (m!=='0' ? ` ${m}분` : '');
  }

  const allTests = getMultiChoiceGroup('an_tests');
  const needsFasting = allTests.includes('공복필요');
  const tests = allTests.filter(t => t !== '공복필요'); // 공복필요는 검사 목록이 아니라 별도 안내로 표시
  const memo = document.getElementById('an_memo').value.trim();

  let msg = `안녕하세요, 삼성자라다소아청소년과입니다.\n`;
  msg += `${name} 환아분의 다음 내원 일정을 안내드립니다.\n\n`;
  msg += `📅 다음 내원일: ${dateKr}`;
  if(timeStr) msg += ` ${timeStr}`;
  msg += `\n`;
  if(tests.length) msg += `\n🔬 예정 검사: ${tests.join(', ')}\n`;
  if(needsFasting) msg += `\n⚠️ 검사를 위해 공복이 필요합니다.\n- 전날 밤 10시 이후 금식을 유지해 주세요.\n- 밤까지는 물 가능, 검사 당일 아침부터는 물도 금식입니다.\n`;
  if(memo) msg += `\n📌 안내사항\n${memo}\n`;
  msg += `\n📅 예약확인/변경: ${NAVER_RESERVATION_URL}\n`;
  msg += `☎ 02-523-0111\n`;
  msg += `\n- 삼성자라다소아청소년과 -`;

  document.getElementById('an_msgOutput').value = msg;
  document.getElementById('an_previewBox').style.display = 'block';
  document.getElementById('an_sendStatus').textContent = '';
  const btn = document.getElementById('an_sendBtn');
  btn.disabled = false; btn.textContent = '🚀 즉시 발송';
}
function copyApptMsg(){
  navigator.clipboard.writeText(document.getElementById('an_msgOutput').value);
  const status = document.getElementById('an_sendStatus');
  status.textContent = '📋 복사되었습니다.'; status.style.color = 'var(--secondary)';
}
async function sendApptMsg(){
  const api = getApiUrl();
  if(!api){ openSettings(); return; }
  const phone = document.getElementById('an_phone').value.trim();
  if(!phone){ alert('보호자 전화번호를 입력해주세요.'); return; }
  const text = document.getElementById('an_msgOutput').value;
  const btn = document.getElementById('an_sendBtn');
  const status = document.getElementById('an_sendStatus');
  btn.disabled = true; btn.textContent = '📤 발송 중…';
  status.textContent = ''; status.style.color = 'var(--secondary)';
  try{
    const res = await fetch(api, { method:'POST', body: JSON.stringify({
      action: 'sendvisitnotice', phone, text,
      name: document.getElementById('an_name').value.trim(),
      date: document.getElementById('an_date').value,
      timeStr: document.getElementById('an_timeNone').classList.contains('active') ? '' : `${document.getElementById('an_hour').value}:${document.getElementById('an_min').value}`,
      tests: getMultiChoiceGroup('an_tests'),
      memo: document.getElementById('an_memo').value.trim(),
      formLink: document.getElementById('an_introFormBtn').classList.contains('used') ? INTAKE_FORM_URL : ''
    })});
    const data = await res.json();
    if(data.status==='ok'){
      status.textContent = '✅ 발송 완료되었습니다.'; status.style.color = 'var(--ok)';
      btn.textContent = '✅ 발송됨';
      renderApptHistory();
    } else {
      status.textContent = '❌ 발송 실패: ' + (data.message||'알 수 없는 오류'); status.style.color = 'var(--danger)';
      btn.disabled = false; btn.textContent = '🚀 즉시 발송';
    }
  }catch(err){
    status.textContent = '❌ 발송 중 오류가 발생했습니다.'; status.style.color = 'var(--danger)';
    btn.disabled = false; btn.textContent = '🚀 즉시 발송';
  }
}
async function renderApptHistory(){
  const box = document.getElementById('an_history');
  const api = getApiUrl();
  if(!api){ box.innerHTML = `<div class="empty-note">⚙️ 설정에서 백엔드 URL을 먼저 입력해주세요.</div>`; return; }
  try{
    const res = await fetch(api);
    const rows = await res.json();
    const list = rows.filter(r=>r.type==='visitNoticeSent').sort((a,b)=> a.timestamp < b.timestamp ? 1 : -1).slice(0, 20);
    if(!list.length){ box.innerHTML = `<div class="empty-note">아직 발송 내역이 없습니다.</div>`; return; }
    box.innerHTML = list.map(r=>{
      let d = {};
      try{ d = JSON.parse(r.question||'{}'); }catch(e){}
      return `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;">
        <b>${escapeHtml(d.name||'')}</b> · ${fmtDate(d.date)||''}${d.timeStr?' '+d.timeStr:''}
        <div style="color:var(--secondary);font-size:11px;margin-top:2px;">${timeAgo(r.timestamp)} 발송${d.channels&&d.channels.length?' · '+d.channels.map(c=>c==='kakao'?'💛카카오':'📱문자').join('+'):''}${d.tests&&d.tests.length?' · '+escapeHtml(d.tests.join(', ')):''}</div>
      </div>`;
    }).join('');
  }catch(err){ box.innerHTML = `<div class="empty-note">불러오지 못했습니다.</div>`; }
}

if(!getApiUrl()) openSettings();
