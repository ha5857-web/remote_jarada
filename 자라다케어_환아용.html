<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>자라다케어 · 환아 안내</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --primary:#1B3A4B; --accent:#C0902C; --secondary:#43555F;
    --light:#FBF8F1; --border:#DED5C6; --ok:#2E8B57; --radius:12px;
  }
  body{ font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--light); color:var(--primary); padding-bottom:30px; }
  header{ background:var(--primary); color:#fff; padding:20px 18px 16px; }
  header h1{ font-size:17px; font-weight:700; }
  header p{ font-size:12px; color:#C7D3D8; margin-top:4px; }
  main{ max-width:520px; margin:0 auto; padding:16px; }
  .tabbar{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; }
  .tabbar button{ flex:0 0 auto; padding:9px 14px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600; color:var(--secondary); font-family:inherit; }
  .tabbar button.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .card{ background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  .card h2{ font-size:14.5px; margin-bottom:12px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; font-weight:700; color:var(--secondary); margin-bottom:5px; }
  .field input, .field textarea{ width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; }
  .field textarea{ min-height:80px; resize:vertical; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; width:100%; padding:13px; border-radius:10px; border:none; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--accent); color:#fff; }
  .btn-outline{ background:#fff; border:1px solid var(--border); color:var(--primary); }
  .msg{ font-size:12.5px; color:var(--ok); margin-top:8px; }
  .qa-item{ border-top:1px dashed var(--border); padding-top:10px; margin-top:10px; }
  .qa-item .q{ font-size:13px; white-space:pre-wrap; }
  .qa-item .a{ font-size:12.5px; color:var(--secondary); margin-top:6px; white-space:pre-wrap; background:var(--light); padding:8px 10px; border-radius:8px; }
  .empty{ font-size:12.5px; color:var(--secondary); text-align:center; padding:20px 0; }
  .upreview{ max-width:100%; max-height:220px; border-radius:8px; margin:10px 0; display:block; border:1px solid var(--border); }
  .view{ display:none; }
  .view.active{ display:block; }
  .notice{ font-size:11.5px; color:var(--secondary); line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1 id="hName">자라다케어 · 환아 안내</h1>
  <p>키/몸무게 기록 · 화상통화 · 질문하기</p>
</header>
<main>
  <div class="tabbar">
    <button class="active" data-t="measure" onclick="switchTab('measure')">성장기록</button>
    <button data-t="files" onclick="switchTab('files')">검사/엑스레이</button>
    <button data-t="call" onclick="switchTab('call')">화상통화</button>
    <button data-t="qa" onclick="switchTab('qa')">질문하기</button>
    <button data-t="bot" onclick="switchTab('bot')">챗봇</button>
  </div>

  <div class="view active" id="v-measure">
    <div class="card">
      <h2>키/몸무게 기록 남기기</h2>
      <div class="field"><label>날짜</label><input type="date" id="m_date"></div>
      <div class="field"><label>키(cm)</label><input type="number" step="0.1" id="m_height"></div>
      <div class="field"><label>몸무게(kg)</label><input type="number" step="0.1" id="m_weight"></div>
      <button class="btn" onclick="submitMeasurement()">전송하기</button>
      <div class="msg" id="m_msg"></div>
    </div>
  </div>

  <div class="view" id="v-files">
    <div class="card">
      <h2>혈액검사 결과지</h2>
      <p class="notice">결과지를 사진으로 찍거나 스캔한 파일을 올려주세요.</p>
      <div style="height:10px;"></div>
      <div class="field"><label>날짜</label><input type="date" id="bt_date"></div>
      <div class="field"><input type="file" id="bt_file" accept="image/*,application/pdf" capture="environment"></div>
      <img class="upreview" id="bt_preview" style="display:none;">
      <button class="btn" onclick="uploadFile('bloodtest')">업로드</button>
      <div class="msg" id="bt_msg"></div>
    </div>
    <div class="card">
      <h2>엑스레이 사진</h2>
      <p class="notice">골연령 등 엑스레이 사진을 올려주세요.</p>
      <div style="height:10px;"></div>
      <div class="field"><label>날짜</label><input type="date" id="xr_date"></div>
      <div class="field"><input type="file" id="xr_file" accept="image/*" capture="environment"></div>
      <img class="upreview" id="xr_preview" style="display:none;">
      <button class="btn" onclick="uploadFile('xray')">업로드</button>
      <div class="msg" id="xr_msg"></div>
    </div>
  </div>

  <div class="view" id="v-call">
    <div class="card">
      <h2>화상통화 참여</h2>
      <p class="notice" id="callNotice">병원에서 안내한 시간에 아래 버튼을 눌러 화상통화에 참여해주세요.</p>
      <div style="height:12px;"></div>
      <a class="btn" id="zoomBtn" href="#" target="_blank">지금 참여하기</a>
    </div>
  </div>

  <div class="view" id="v-qa">
    <div class="card">
      <h2>궁금한 점 남기기</h2>
      <div class="field"><textarea id="q_text" placeholder="예: 이번 주부터 두통을 호소하는데 성장호르몬 주사와 관련 있을까요?"></textarea></div>
      <button class="btn" onclick="submitQuestion()">질문 보내기</button>
      <div class="msg" id="q_msg"></div>
    </div>
    <div class="card">
      <h2>지난 질문/답변</h2>
      <div id="qaList"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>

  <div class="view" id="v-bot">
    <div class="card">
      <h2>자라다케어 챗봇</h2>
      <p class="notice">성장, 성조숙증, 검사 결과 등 자주 묻는 질문은 챗봇에서 바로 안내받을 수 있어요.</p>
      <div style="height:12px;"></div>
      <a class="btn" id="chatbotBtn" href="#" target="_blank">챗봇 열기</a>
    </div>
  </div>
</main>

<script>
const qs = new URLSearchParams(location.search);
const PID = qs.get('pid') || '';
const API = qs.get('api') || '';
const ZOOM = qs.get('zoom') || '';
const CHATBOT_URL = qs.get('bot') || '자라다케어_챗봇.html';
const NAME = qs.get('name') || '';

if(NAME) document.getElementById('hName').textContent = `자라다케어 · ${NAME} 환아`;
document.getElementById('m_date').value = todayStr();
document.getElementById('bt_date').value = todayStr();
document.getElementById('xr_date').value = todayStr();
document.getElementById('zoomBtn').href = ZOOM || '#';
if(!ZOOM) document.getElementById('callNotice').textContent = '아직 화상통화 링크가 등록되지 않았습니다. 병원에 문의해주세요.';
document.getElementById('chatbotBtn').href = CHATBOT_URL;

function todayStr(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`; }

function switchTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+t).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tabbar button[data-t="${t}"]`).classList.add('active');
  if(t==='qa') loadQA();
}

/* ---------------- 파일 업로드 (혈액검사 결과지 / 엑스레이) ---------------- */
document.getElementById('bt_file').addEventListener('change', e=>previewFile(e, 'bt_preview'));
document.getElementById('xr_file').addEventListener('change', e=>previewFile(e, 'xr_preview'));

function previewFile(evt, previewId){
  const file = evt.target.files[0];
  const img = document.getElementById(previewId);
  if(!file || !file.type.startsWith('image/')){ img.style.display='none'; return; }
  img.src = URL.createObjectURL(file);
  img.style.display='block';
}

// 이미지는 브라우저에서 리사이즈·압축해서 업로드 용량을 줄입니다. PDF 등은 그대로 base64 인코딩합니다.
function fileToDataUrl(file, maxDim=1600, quality=0.82){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith('image/')){
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width*scale); height = Math.round(height*scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function uploadFile(kind){
  const isBT = kind === 'bloodtest';
  const fileInput = document.getElementById(isBT ? 'bt_file' : 'xr_file');
  const date = document.getElementById(isBT ? 'bt_date' : 'xr_date').value;
  const msg = document.getElementById(isBT ? 'bt_msg' : 'xr_msg');
  const file = fileInput.files[0];
  if(!PID || !API){ msg.textContent = '연동 정보가 없습니다. 병원에서 안내받은 링크로 다시 접속해주세요.'; msg.style.color='var(--accent)'; return; }
  if(!file){ msg.textContent = '파일을 선택해주세요.'; msg.style.color='var(--accent)'; return; }
  msg.textContent = '업로드 중…'; msg.style.color='var(--secondary)';
  try{
    const dataUrl = await fileToDataUrl(file);
    await fetch(API, { method:'POST', body: JSON.stringify({ id: uid(), pid: PID, type: kind, date, dataUrl, fileName: file.name }) });
    msg.textContent = '업로드되었습니다. 감사합니다!'; msg.style.color='var(--ok)';
    fileInput.value = '';
  }catch(err){ msg.textContent = '업로드에 실패했습니다. 잠시 후 다시 시도해주세요.'; msg.style.color='var(--accent)'; }
}

async function submitMeasurement(){
  const date = document.getElementById('m_date').value;
  const height = document.getElementById('m_height').value;
  const weight = document.getElementById('m_weight').value;
  const msg = document.getElementById('m_msg');
  if(!PID || !API){ msg.textContent = '연동 정보가 없습니다. 병원에서 안내받은 링크로 다시 접속해주세요.'; msg.style.color='var(--accent)'; return; }
  if(!height && !weight){ msg.textContent = '키 또는 몸무게 중 하나는 입력해주세요.'; msg.style.color='var(--accent)'; return; }
  try{
    await fetch(API, { method:'POST', body: JSON.stringify({ id: uid(), pid: PID, type:'measurement', date, height, weight }) });
    msg.textContent = '전송되었습니다. 감사합니다!'; msg.style.color='var(--ok)';
    document.getElementById('m_height').value=''; document.getElementById('m_weight').value='';
  }catch(err){ msg.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해주세요.'; msg.style.color='var(--accent)'; }
}

async function submitQuestion(){
  const text = document.getElementById('q_text').value.trim();
  const msg = document.getElementById('q_msg');
  if(!PID || !API){ msg.textContent = '연동 정보가 없습니다. 병원에서 안내받은 링크로 다시 접속해주세요.'; msg.style.color='var(--accent)'; return; }
  if(!text){ return; }
  try{
    await fetch(API, { method:'POST', body: JSON.stringify({ id: uid(), pid: PID, type:'question', date: todayStr(), question: text }) });
    msg.textContent = '질문이 전달되었습니다.'; msg.style.color='var(--ok)';
    document.getElementById('q_text').value='';
    loadQA();
  }catch(err){ msg.textContent = '전송에 실패했습니다.'; msg.style.color='var(--accent)'; }
}

async function loadQA(){
  const list = document.getElementById('qaList');
  if(!PID || !API){ list.innerHTML = '<div class="empty">연동 정보가 없습니다.</div>'; return; }
  try{
    const res = await fetch(API);
    const rows = await res.json();
    const mine = rows.filter(r=>r.pid===PID);
    const questions = mine.filter(r=>r.type==='question').sort((a,b)=> a.timestamp < b.timestamp ? 1 : -1);
    const answers = {};
    mine.filter(r=>r.type==='answer').forEach(r=>{ answers[r.refId] = r.answer; });
    if(!questions.length){ list.innerHTML = '<div class="empty">아직 남긴 질문이 없습니다.</div>'; return; }
    list.innerHTML = questions.map(q=>`
      <div class="qa-item">
        <div class="q">Q. ${escapeHtml(q.question)}</div>
        ${answers[q.id] ? `<div class="a">A. ${escapeHtml(answers[q.id])}</div>` : '<div class="a">답변 대기 중입니다.</div>'}
      </div>
    `).join('');
  }catch(err){ list.innerHTML = '<div class="empty">불러오지 못했습니다.</div>'; }
}
</script>
</body>
</html>
