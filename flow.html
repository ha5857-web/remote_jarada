<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환자별 동선 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: 현황판 / 동선 지도 / 소요 시간 탭이 왼쪽, 선택한 환자의 단계별 입력과 동선 기록이 오른쪽에 붙는 2단 운영 화면.
   색은 상태 신호(진행 teal, 지연 amber, 완료 green)로만 쓰고 나머지는 청회색 중립. */
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --surface2:#F5F8F8; --ink:#14232B; --muted:#5A6B73; --line:#D5DFDF;
  --accent:#0B7A85; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0;
  --warn:#B96A00; --warn-soft:#FBEBCF; --ok:#2B7A4B; --ok-soft:#DDF0E4; --bad:#B63A32; --bad-soft:#F8DEDB;
  --room:#F7FAFA; --room-line:#B9C8C8; --hall:#E3EBEB;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A1F; --surface:#17252C; --surface2:#1D2E36; --ink:#E6EEF0; --muted:#97AAB2; --line:#2B3F49;
    --accent:#4FC3CE; --accent-ink:#06242A; --accent-soft:#16414A;
    --warn:#F0B355; --warn-soft:#4A3716; --ok:#6CCB8E; --ok-soft:#17402A; --bad:#F08A82; --bad-soft:#4B1F1C;
    --room:#1A2A31; --room-line:#3B515B; --hall:#13222A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A1F; --surface:#17252C; --surface2:#1D2E36; --ink:#E6EEF0; --muted:#97AAB2; --line:#2B3F49;
  --accent:#4FC3CE; --accent-ink:#06242A; --accent-soft:#16414A;
  --warn:#F0B355; --warn-soft:#4A3716; --ok:#6CCB8E; --ok-soft:#17402A; --bad:#F08A82; --bad-soft:#4B1F1C;
  --room:#1A2A31; --room-line:#3B515B; --hall:#13222A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:12px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1840px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;margin-right:3px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
/* board */
.layout:has(#detail .empty){grid-template-columns:minmax(0,1fr)}.layout:has(#detail .empty) #detail{display:none}
.board{display:flex;gap:6px;overflow:visible;padding-bottom:6px}.board>.col{flex:1 1 0;min-width:0}
.board .col{padding:6px;min-width:0}.board .col h3{font-size:11.5px}.board .card{padding:6px 7px}.board .card .nm{font-size:13px;gap:4px}.board .card .meta{font-size:11px}.board .card .st{font-size:11px}.board .pill{padding:1px 5px;font-size:10.5px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.col h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between}
.col h3 span{font-family:var(--mono)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 9px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .meta{font-size:12px;color:var(--muted)}
.card .st{font-size:12px;display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.card .bar{display:flex;gap:2px;margin-top:2px}
.card .bar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.card .bar i.d{background:var(--ok)}
.card .bar i.c{background:var(--accent)}
.card.warn .bar i.c{background:var(--warn)}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ex{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:17px;margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:46ch}
/* map */
.m3wrap{display:flex;flex-direction:column;gap:8px}
.m3bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.m3bar b{color:var(--ink)}
.m3btns{display:flex;gap:6px;flex-wrap:wrap}
.m3host{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 30%,var(--surface) 0%,var(--surface2) 100%)}
.m3canvas{display:block;touch-action:none}
.m3tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap}
.m3tip[hidden]{display:none}
.mapwrap{overflow-x:auto}
.map{width:100%;min-width:560px;height:auto;display:block}
.map .room{fill:var(--room);stroke:var(--room-line);stroke-width:1.5}
.map .hall{fill:var(--hall)}
.map .rl{fill:var(--muted);font-size:13px;font-weight:600;font-family:var(--font)}
.map .hl{fill:var(--muted);font-size:11px;letter-spacing:.3em;font-family:var(--font)}
.map .path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:7 5;opacity:.9}
.map .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2;cursor:pointer}
.map .dot.warn{stroke:var(--warn)}
.map .dot.sel{fill:var(--accent);}
.map .dot2{stroke:#fff;stroke-width:2;cursor:pointer}
.map .dot2.warn{stroke:var(--warn);stroke-width:4}
.map .dot2.sel{stroke:var(--ink);stroke-width:3}
.map .dt2{fill:#fff;font-size:12px;font-weight:700;pointer-events:none;font-family:var(--font)}
.map .dt{fill:var(--ink);font-size:12px;font-weight:600;pointer-events:none;font-family:var(--font)}
.map .dot.sel+.dt{fill:var(--accent-ink)}
.map .badge{fill:var(--accent)}
.map .bt{fill:var(--accent-ink);font-size:10px;font-weight:700;font-family:var(--mono);pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);vertical-align:-1px;margin-right:5px}
.legend i.w{border-color:var(--warn)}
/* stats */
.frow{display:grid;grid-template-columns:minmax(0,1fr) 130px 90px;gap:8px;align-items:center;padding:5px 0;font-size:13px;border-bottom:1px solid var(--line)}
.frow select,.frow input,.frooms input{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.frow input[type=number]{width:56px}
.frooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.frooms label{display:grid;gap:3px}
@media(max-width:520px){.frow{grid-template-columns:1fr 1fr}.frow>span{grid-column:1/-1}}
.kiosk{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);padding:28px 20px;overflow:auto;font-size:18px;line-height:1.5}
.kiosk h2{margin:0 0 8px;font-size:26px}
.kiosk .kbig{font-size:22px;margin:8px 0}
.kiosk .klist{list-style:none;padding:0;margin:12px 0;max-width:520px}
.kiosk .klist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.kiosk .klist li.d{color:var(--muted)}
.kiosk .klist li.c{font-weight:700;color:var(--accent)}
.kiosk .keta{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;max-width:520px;margin-top:12px}
.eb{display:block;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.eb i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kiosk .kvbox{margin-top:18px;max-width:640px}
.kiosk .kvitem{margin:8px 0}
.kiosk .kvrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px;color:inherit;font:inherit;cursor:pointer}
.kiosk .kvitem.on .kvrow{border-color:#7dd3c0}
.kiosk .kvth{position:relative;flex:0 0 132px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;display:block}
.kiosk .kvth img{width:100%;height:100%;object-fit:cover;display:block}
.kiosk .kvth i{position:absolute;inset:0;margin:auto;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-style:normal;font-size:16px;display:flex;align-items:center;justify-content:center}
.kiosk .kvtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.kiosk .kvtx em{font-style:normal;font-size:13px;opacity:.75}
.kiosk .kvtx b{font-size:17px;line-height:1.35}
.kiosk .kvopen{display:block;margin:6px 0 2px;font-size:15px}

.kiosk .kv{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;margin:6px 0 2px}
.xvbox{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.xvh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.xvchips{display:flex;flex-wrap:wrap;gap:6px}
.xvchip{font:inherit;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.xvchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.xvchip small{font-size:11px;opacity:.85;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:0 5px;margin-left:2px}
.xvchip.on small{background:rgba(255,255,255,.25);color:inherit}
.xvchip small.nolink{background:var(--bad-soft,#F8DEDB);color:var(--bad)}
body.pm{--bg:#EAF3F2;--surface:#FFFFFF;--surface2:#F3FAF9;--ink:#14232B;--muted:#5A6B73;--line:#D5E3E2;--accent:#0B7A85;--accent-ink:#FFFFFF;--accent-soft:#D9EEF0;--warn:#B96A00;--warn-soft:#FBEBCF;--ok:#2B7A4B;--ok-soft:#DDF0E4;--bad:#B63A32;color-scheme:light;background:#EAF3F2;color:#14232B}
body.pm .kiosk{padding:0 0 40px;font-size:19px;background:linear-gradient(#EAF3F2,#F6FBFA 60%);color:#14232B}
body.pm .kiosk>*:not(.pm-hero){margin-left:16px;margin-right:16px}
body.pm .kiosk>:first-child:not(.pm-hero){margin-top:24px}
body.pm .pm-hero{background:linear-gradient(135deg,#0B7A85,#0E5E73);color:#fff;padding:22px 20px 26px;border-radius:0 0 28px 28px;box-shadow:0 8px 22px rgba(11,94,115,.25)}
body.pm .pm-hero small{display:block;font-size:14px;opacity:.85;letter-spacing:.02em}
body.pm .pm-hero h2{margin:4px 0 14px;font-size:30px;color:#fff}
body.pm .pm-now{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);border-radius:16px;padding:12px 16px;font-size:18px}
body.pm .pm-now b{font-size:26px;font-weight:700}
body.pm .pm-now .pm-t{margin-left:auto;background:#fff;color:#0B7A85;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
body.pm .pm-track{list-style:none;display:flex;justify-content:space-between;margin:18px 16px 4px;padding:0;position:relative}
body.pm .pm-track::before{content:"";position:absolute;left:5%;right:5%;top:15px;height:3px;background:#C9DAD9}
body.pm .pm-track li{position:relative;flex:1;text-align:center;font-size:12px;color:#6A7C84}
body.pm .pm-track li i{display:flex;margin:0 auto 4px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #C9DAD9;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px;position:relative}
body.pm .pm-track li.d i{background:#2B7A4B;border-color:#2B7A4B;color:#fff}
body.pm .pm-track li.c i{background:#0B7A85;border-color:#0B7A85;color:#fff;box-shadow:0 0 0 5px rgba(11,122,133,.2)}
body.pm .pm-track li.c{color:#0B7A85;font-weight:700}
body.pm .kiosk .keta{background:#fff;border:0;border-radius:18px;box-shadow:0 4px 16px rgba(20,35,43,.08);padding:16px}
body.pm .kiosk .kvbox>b{font-size:20px}
body.pm .kiosk .kvrow{background:#fff;border:0;box-shadow:0 4px 16px rgba(20,35,43,.1);border-radius:18px;padding:10px 10px 14px}
body.pm .kiosk .kvth{border-radius:12px;background:linear-gradient(135deg,#0B7A85,#0E5E73)}
body.pm .kiosk .kvitem.on .kvrow{box-shadow:0 0 0 3px #0B7A85,0 4px 16px rgba(20,35,43,.1)}
body.pm .kiosk .kvtx em{display:inline-block;align-self:flex-start;background:#D9EEF0;color:#0B7A85;border-radius:999px;padding:2px 10px;font-weight:700;opacity:1}
body.pm .kiosk .kvtx b{color:#14232B}
body.pm .kiosk .kvopen{color:#0B7A85;font-weight:700}

body.pm .kiosk .keta,body.pm .kiosk .klist,body.pm .kiosk .kvbox{max-width:none;width:auto}
body.pm .kiosk h2{font-size:26px}
body.pm .kiosk .kbig{font-size:20px}
body.pm .kiosk .kvrow{flex-direction:column;align-items:stretch;gap:8px;padding:8px 8px 12px}
body.pm .kiosk .kvth{flex:none;width:100%}
body.pm .kiosk .kvth i{width:56px;height:56px;font-size:24px}
body.pm .kiosk .kvtx b{font-size:19px}
body.pm .kiosk .kvtx em{font-size:14px}
body.pm .kiosk .keta a.btn,body.pm .kiosk .keta a{font-size:18px}
.kiosk .khint{color:var(--muted);font-size:14px;margin-top:20px}
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.login form{width:min(380px,100%);display:grid;gap:12px}
.login input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.lk{display:grid;gap:8px}.lkres{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.more{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.more summary{cursor:pointer;font-size:13px}
.more>*{margin-top:8px}
.srow{display:grid;grid-template-columns:96px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.srow .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.srow .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.srow .tr i.w{background:var(--warn)}
.srow span:last-child{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
/* detail */
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h2{margin:0;font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stepper{display:flex;gap:4px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.stepper button{flex:1 0 auto;min-width:56px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 6px;font-size:11px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.stepper button b{font-family:var(--mono);font-size:11px}
.stepper button.d{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stepper button.c{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper button.c.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.stepper button.v{outline:2px solid var(--ink);outline-offset:1px}
.sect{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.sect h3{margin:0 0 8px;font-size:14px}
.f{display:grid;gap:10px}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.l{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;color:var(--ink)}
textarea{min-height:68px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 110px auto 22px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.lab .ok{color:var(--ok);font-weight:700;text-align:center}
.calc{font-family:var(--mono);font-size:13px;background:var(--surface2);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.msg{font-size:12px;color:var(--bad);flex-basis:100%}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tl time{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tl .du{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}

<script>
/* ---------- 단계·공간 정의 ---------- */
const STEPS=[
  {name:'접수·대기',short:'대기',room:'wait',warn:15},
  {name:'초진기록지',short:'기록지',room:'wait',warn:15},
  {name:'초진방 링크 발송',short:'초진방',room:'wait',warn:5},
  {name:'계측·인바디',short:'계측',room:'wait',warn:10},
  {name:'X-ray',short:'X-ray',room:'xray',warn:15},
  {name:'채혈',short:'채혈',room:'lab',warn:10},
  {name:'결과 대기',short:'결과대기',room:'wait',warn:40},
  {name:'결과 확인',short:'진료',room:'doctor',warn:15},
  {name:'수납·귀가',short:'귀가',room:'exit',warn:10},
  {name:'결과지 리포트',short:'리포트',room:'exit',warn:0}
];
/* 평면도 기준 배치: 위쪽 4개 방은 아래 대기·원무 공간으로 열려 있고, 출입구(E.N.T)는 아래쪽 중앙 오른쪽.
   door = 방의 출입 지점, dy = 환자 점이 시작되는 높이 */
const ROOMS={
  fluid:{x:20,y:20,w:170,h:140,label:'수액실',door:[105,160],dy:62},
  clin:{x:200,y:20,w:170,h:140,label:'임상병리실',door:[285,160],dy:62},
  lab:{x:380,y:20,w:150,h:140,label:'채혈실·주사실',door:[455,160],dy:62},
  xray:{x:540,y:20,w:200,h:140,label:'엑스레이실',door:[640,160],dy:62},
  wait:{x:140,y:190,w:395,h:215,label:'대기·원무',door:[330,190],dy:68},
  doctor:{x:545,y:190,w:195,h:215,label:'진료실',door:[620,190],dy:68},
  exit:{x:380,y:415,w:200,h:56,label:'출입구',door:[480,415],dy:42}
};
function boardCols(){
  const used=new Set(['booked','exit']);
  STEPS.forEach(s=>used.add(s.room));
  S.items.forEach(v=>used.add(roomOf(v)));
  return ['booked','wait','fluid','clin','lab','xray','doctor','exit'].filter(k=>used.has(k)).map(k=>({key:k,label:k==='booked'?'예약':(k==='exit'?'귀가·리포트':ROOMS[k].label)}));
}
const LAB_OPTS=['원내검사','수탁검사'];
const LAB_DEFAULT=['원내검사'];
const PURPOSE=['성장 평가','성조숙증','비만·대사','기타'];
const PROTOS={single:{name:'일반 채혈',offs:[]},gnrh:{name:'GnRH 자극검사',offs:[0,30,45,60,90]},gh:{name:'GH 자극검사',offs:[0,30,60,90,120]}};

/* ---------- 유틸 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const fmtT=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const mins=ms=>Math.max(0,Math.round(ms/60000));
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?undefined:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks[ks.length-1]]=v};
const uid=()=>'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},2600)}

/* ---------- 방문 데이터 도우미 ---------- */
function roomOf(v){
  if(v.step<0)return 'booked';
  if(v.step>=9)return 'exit';
  return STEPS[v.step].room;
}
function stepStart(v,i){const e=(v.log||[]).find(l=>l.s===i);return e?e.t:null}
function stepDur(v,i,now){
  const t=stepStart(v,i);if(t==null)return null;
  const nx=(v.log||[]).find(l=>l.s>i);
  const end=nx?nx.t:(v.step===i?now:(v.doneAt&&i===9?v.doneAt:null));
  if(end==null)return null;
  return end-t;
}
function curElapsed(v,now){
  if(v.step<0||v.step>=10)return 0;
  const t=stepStart(v,v.step);return t==null?0:now-t;
}
function warnAt(v,i){
  let w=STEPS[i].warn;
  if(i===5&&timed(v)){const o=PROTOS[v.lab.proto].offs;w=o[o.length-1]+15}
  return w;
}
function isWarn(v,now){
  if(v.step<0||v.step>=9)return false;
  return mins(curElapsed(v,now))>warnAt(v,v.step);
}
function stayMs(v,now){
  const a=stepStart(v,0);if(a==null)return 0;
  const endLog=(v.log||[]).find(l=>l.s===9);
  return (endLog?endLog.t:now)-a;
}
function waitMs(v,now){return (stepDur(v,0,now)||0)+(stepDur(v,6,now)||0)}
function bmi(v){
  const h=parseFloat(v.measure&&v.measure.height),w=parseFloat(v.measure&&v.measure.weight);
  if(!(h>0&&w>0))return null;
  return w/Math.pow(h/100,2);
}
function blank(){
  return {intake:{chief:'',purpose:PURPOSE[0],fatherH:'',motherH:'',history:'',signs:'',consent:false},
    measure:{height:'',weight:''},xray:{part:'왼손 정면 (골연령)',done:false,note:''},
    lab:{items:LAB_DEFAULT.slice(),drawn:false,results:{},proto:'single',t0:null,draws:[],ext:{},at:{}},
    review:{boneAge:'',note:'',next:''},exit:{paid:false,guide:false},report:{sent:false}};
}
function newVisit(f){
  const dd=new Date(),v=Object.assign({id:uid(),sv:2,name:'',age:'',sex:'여',chartNo:'',card:'',appt:'',step:-1,log:[],createdAt:Date.now(),date:dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate())},blank(),f);
  return v;
}
/* 단계 완료 조건. 부족하면 안내 문구를 돌려준다 */
/* 재진 환자는 '초진방 링크 발송' 단계를 건너뜀 (이미 링크를 보낸 경우는 제외) */
const skipStep=(v,i)=>i===2&&!!v.rev&&!(v.invite&&v.invite.sentAt);
function blocker(v){
  switch(v.step){
    case 1:case 2:case 3:case 4:return null;
    case 5:
      if(timed(v)){if(!v.lab.t0)return '검사 시작 버튼을 눌러 주세요.';const n=pendDraws(v).length;return n?'남은 채혈 '+n+'회':null}
      return null;
    case 6:{const miss=pendingItems(v).filter(k=>!isExt(v,k));return miss.length?'결과가 아직 없는 항목: '+miss.join(', ')+' (수탁검사는 결과 대기 상태로 넘어갈 수 있습니다)':null}
    case 7:case 8:return null;
    default:return null;
  }
}

/* ---------- 채혈 타이머·결과 안내 도우미 ---------- */
const timed=v=>!!(v.lab&&v.lab.proto&&v.lab.proto!=='single'&&PROTOS[v.lab.proto]);
const isExt=(v,k)=>k==='수탁검사'||!!(v.lab&&v.lab.ext&&v.lab.ext[k]);
function pendingItems(v){const r=(v.lab&&v.lab.results)||{};return ((v.lab&&v.lab.items)||[]).filter(k=>!String(r[k]||'').trim())}
function pendDraws(v){return timed(v)?(v.lab.draws||[]).filter(d=>!d.done):[]}
function lastResultAt(v){const a=(v.lab&&v.lab.at)||{};return Math.max(0,...((v.lab&&v.lab.items)||[]).map(k=>a[k]||0))}
function needNotify(v){
  if(v.step<8||v.notifiedAt||!(v.lab&&v.lab.items&&v.lab.items.length))return false;
  if(pendingItems(v).length)return false;
  const left=stepStart(v,8);return left!=null&&lastResultAt(v)>left;
}
function waitingAfterLeave(v){return v.step>=8&&v.lab&&v.lab.items&&v.lab.items.length>0&&pendingItems(v).length>0}
function drawList(now){
  const out=[];
  S.items.forEach(v=>{if(v.step===5&&timed(v)&&v.lab.t0)(v.lab.draws||[]).forEach(d=>{if(!d.done)out.push({v:v,d:d,left:d.due-now})})});
  return out.sort((a,b)=>a.left-b.left);
}
function fmtLeft(ms){
  if(ms>0){const s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)}
  return '지연 '+Math.max(1,Math.floor(-ms/60000))+'분';
}
function startDraws(v){
  const t=Date.now(),o=PROTOS[v.lab.proto].offs;
  v.lab.t0=t;v.lab.draws=o.map(m=>({off:m,due:t+m*60000,done:m===0?t:null}));
}

/* ---------- 저장소: 자라다케어 서버(Apps Script)의 Flow 시트를 여러 기기가 공유 ---------- */
const S={items:new Map(),synced:{},timers:{},busy:{},queue:{},canWrite:true,subs:[],loaded:false,sig:'',cfgSig:''};
const API_KEY='jrd_api_url',TOKEN_KEY='jrd_auth_token';
const ls={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const apiUrl=()=>ls.get(API_KEY);
function authToken(){const t=ls.get(TOKEN_KEY);const exp=Number(t.split('.')[1]);return exp&&exp>Date.now()?t:''}
function emit(){S.subs.forEach(f=>f())}
async function api(body){
  if(S.halt)throw {code:'HALT'};
  const url=apiUrl(),t=authToken();
  if(!url||!t){showLogin();throw {code:'AUTH_REQUIRED'}}
  const r=await fetch(url,{method:'POST',body:JSON.stringify(Object.assign({},body,{auth:t}))});
  const j=await r.json();
  if(j&&j.code==='AUTH_REQUIRED'){ls.del(TOKEN_KEY);showLogin();throw {code:'AUTH_REQUIRED'}}
  return j;
}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* 바뀐 칸만 보냅니다: 최상위 칸, 그리고 객체는 한 단계 안쪽 칸까지("lab.results" 처럼) */
function diffPatch(v,base){
  const p={};
  Object.keys(v).forEach(k=>{
    if(k==='id')return;
    const a=v[k],b=base?base[k]:undefined;
    if(same(a,b))return;
    if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){
      new Set(Object.keys(a).concat(Object.keys(b))).forEach(s=>{if(!same(a[s],b[s]))p[k+'.'+s]=a[s]===undefined?null:a[s]});
    }else p[k]=a;
  });
  return p;
}
function flush(id){
  clearTimeout(S.timers[id]);delete S.timers[id];
  S.queue[id]=(S.queue[id]||Promise.resolve()).then(async()=>{
    const v=S.items.get(id);if(!v)return;
    const snap=clone(v),patch=diffPatch(snap,S.synced[id]);
    if(!Object.keys(patch).length)return;
    S.busy[id]=(S.busy[id]||0)+1;
    try{
      const j=await api({action:'flowsave',id:id,patch:patch});
      if(!j||j.status!=='ok')throw new Error((j&&j.message)||'저장 실패');
      S.synced[id]=snap;
    }catch(e){
      if(e&&e.code==='HALT')return;
      if(!e||e.code!=='AUTH_REQUIRED'){toast('저장하지 못했습니다. 잠시 후 다시 시도합니다.');clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),5000)}
    }finally{S.busy[id]--}
  });
  return S.queue[id];
}
function schedule(id){clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),600)}
function put(v,now){v.updatedAt=Date.now();S.items.set(v.id,v);if(now)flush(v.id);else schedule(v.id);emit()}
function remove(id){
  S.items.delete(id);clearTimeout(S.timers[id]);delete S.timers[id];delete S.synced[id];
  S.queue[id]=(S.queue[id]||Promise.resolve()).then(()=>api({action:'flowdelete',id:id})).catch(()=>toast('삭제하지 못했습니다.'));
  emit();
}
const pending=id=>!!S.timers[id]||S.busy[id]>0;
let polling=false;
async function poll(){
  if(polling||!authToken()||!apiUrl())return;
  polling=true;
  try{
    const j=await api({action:'flowlist'});
    if(!j||j.status!=='ok')throw new Error((j&&j.message)||'목록을 불러오지 못했습니다.');
    if(!Array.isArray(j.visits)){S.halt=true;throw new Error('server-old')}
    const srv=new Map();j.visits.forEach(o=>srv.set(o.id,o));
    srv.forEach((o,id)=>{if(pending(id))return;const c=clone(o);S.synced[id]=clone(o);if(!c.sv&&id!=='config:flow'){/* 단계가 하나 늘어난 이전 기록을 새 번호로 옮깁니다 */if(c.step>=2)c.step++;(c.log||[]).forEach(l=>{if(l.s>=2)l.s++});c.sv=2;S.items.set(id,c);setTimeout(()=>flush(id),50)}else S.items.set(id,c)});
    [...S.items.keys()].forEach(id=>{if(!srv.has(id)&&S.synced[id]&&!pending(id)){S.items.delete(id);delete S.synced[id]}});
    if(j.config){const cs=JSON.stringify(j.config);if(cs!==S.cfgSig){S.cfgSig=cs;applyFlow(j.config)}}
    const sig=JSON.stringify([...S.items.values()].map(v=>[v.id,v.updatedAt]));
    const first=!S.loaded;S.loaded=true;
    if(first||sig!==S.sig){S.sig=sig;emit()}
    hideConn();
  }catch(e){if(!e||e.code!=='AUTH_REQUIRED')showConn(e&&e.message==='server-old'?HALT_MSG:(e&&e.code==='HALT'?HALT_MSG:'서버와 연결이 끊겼습니다. 다시 시도하는 중…'))}
  finally{polling=false}
}
const HALT_MSG='서버에 Flow 파일이 아직 반영되지 않았습니다. Apps Script의 Code.gs에 flowDispatch_ 줄이 있는지, Flow.gs가 있는지, 배포 관리에서 새 버전으로 배포했는지 확인한 뒤 이 페이지를 새로고침해 주세요.';
function showConn(t){const b=$('#ro-banner');b.textContent=t;b.hidden=false}
function hideConn(){$('#ro-banner').hidden=true}
function showLogin(){const o=$('#login');if(o){o.hidden=false;$('#lg-url').value=apiUrl();$('#lg-url-wrap').hidden=!!apiUrl();setTimeout(()=>$('#lg-pw').focus(),50)}}
async function doLogin(e){
  e.preventDefault();
  const m=$('#lg-msg'),url=($('#lg-url').value||apiUrl()).trim(),pw=$('#lg-pw').value;
  if(!url){m.textContent='서버 주소를 입력해 주세요.';return}
  if(!pw){m.textContent='비밀번호를 입력해 주세요.';return}
  m.textContent='확인하는 중…';
  try{
    const r=await fetch(url,{method:'POST',body:JSON.stringify({action:'login',password:pw})});
    const j=await r.json();
    if(j&&j.status==='ok'&&j.token){ls.set(API_KEY,url);ls.set(TOKEN_KEY,j.token);ls.set('jrd_auth_mode','token');$('#lg-pw').value='';m.textContent='';$('#login').hidden=true;poll()}
    else m.textContent=(j&&j.message)||'로그인하지 못했습니다.';
  }catch(err){m.textContent='서버에 연결하지 못했습니다. 서버 주소를 확인해 주세요.'}
}
function logout(){ls.del(TOKEN_KEY);S.items.clear();S.synced={};S.loaded=false;emit();showLogin()}
async function initStore(){
  if(authToken()&&apiUrl())poll();else showLogin();
  setInterval(poll,4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
}
function setReadonly(){}

  const mk=(f,steps)=>{
    const v=newVisit(Object.assign({example:true},f));
    let t=now-steps.reduce((a,b)=>a+b,0)*M;
    v.log=[];steps.forEach((d,i)=>{v.log.push({s:i,t:t});t+=d*M});
    v.step=steps.length-1;return v;
  };
  const a=mk({name:'김서윤',age:9,sex:'여',chartNo:'A-2041',appt:'09:30'},[12,10,2,4,9,6,3]);
  Object.assign(a.intake,{chief:'또래보다 키가 작고 가슴 몽우리가 만져짐',purpose:'성조숙증',fatherH:'176',motherH:'161',consent:true});

  const b=mk({name:'박도현',age:12,sex:'남',chartNo:'A-2044',appt:'10:00'},[7,6]);

  Object.assign(c.measure,{height:'124.5',weight:'33.1'});Object.assign(c.xray,{done:true});
  c.lab.items=['원내검사'];c.lab.drawn=true;

  Object.assign(f.intake,{chief:'성조숙증 의심, GnRH 자극검사',purpose:'성조숙증',consent:true});
  Object.assign(f.measure,{height:'142.0',weight:'36.5'});Object.assign(f.xray,{done:true});
  f.lab.items=['원내검사'];f.lab.proto='gnrh';
  const t0=now-43*M;
  f.lab.t0=t0;f.lab.draws=PROTOS.gnrh.offs.map(m=>({off:m,due:t0+m*M,done:m===0?t0:(m===30?t0+31*M:null)}));
  /* 귀가 후 수탁검사 결과 대기 */
  const e=mk({name:'오세린',age:8,sex:'여',chartNo:'A-2019',appt:'09:10'},[6,9,2,4,7,6,22,8,3,2]);
  Object.assign(e.intake,{chief:'키 성장 둔화',purpose:'성장 평가',consent:true});
  Object.assign(e.measure,{height:'121.3',weight:'22.4'});Object.assign(e.xray,{done:true});
  e.lab.items=['원내검사','수탁검사'];e.lab.drawn=true;e.lab.extDate=new Date(Date.now()+4*86400000).toISOString().slice(0,10);
  e.lab.results={'원내검사':'완료'};e.lab.at={'원내검사':now-90*M};

function clearExamples(){[...S.items.values()].filter(v=>v.example).forEach(v=>remove(v.id))}
/* ---------- 화면 상태 ---------- */
const UI={view:'board',sel:null,viewStep:null,adding:false,confirmDel:null,msg:'',cprefix:'C',cstart:1,ccount:40};
const list=()=>{const d=new Date(),td=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());return [...S.items.values()].filter(v=>!(v.step<0&&v.date&&v.date!==td))};
const age=v=>v.age===''||v.age==null?'':'만 '+v.age+'세';
const exTag=v=>v.example?'<span class="pill ex">예시</span>':'';

/* ---------- 요약 ---------- */
function renderSummary(){
  const now=Date.now(),a=list();
  const booked=a.filter(v=>v.step<0).length;
  const ing=a.filter(v=>v.step>=0&&v.step<=8).length;
  const warn=a.filter(v=>isWarn(v,now)).length;
  const out=a.filter(v=>v.step>=9);
  const avg=out.length?Math.round(out.reduce((s,v)=>s+mins(stayMs(v,now)),0)/out.length)+'분':'-';
  $('#summary').innerHTML=
    `<span><b>${a.length}</b>오늘 환자</span><span><b>${booked}</b>도착 전</span><span><b>${ing}</b>진행 중</span>`+
    `<span style="${warn?'color:var(--warn)':''}"><b style="${warn?'color:var(--warn)':''}">${warn}</b>지연</span>`+
    `<span><b>${out.length}</b>귀가</span><span><b>${avg}</b>평균 체류</span>`;
}

/* ---------- 현황판 ---------- */
function invTag(v){
  if(!v.first||(v.rev&&!(v.invite&&v.invite.sentAt)))return '';
  return (v.temp?'<span class="pill ex">당일</span>':'')+(v.invite&&v.invite.sentAt?'<span class="pill ok">초진방 ✓</span>':'<span class="pill warn">초진방 전</span>');
}
function cardHtml(v,now){
  const w=isWarn(v,now),sel=UI.sel===v.id;
  let st;
  if(v.step<0)st=`<span>예약 ${esc(v.appt||'--:--')}</span><span>도착 전</span>`;
  else if(v.step>=10)st=`<span>완료</span><span>${mins(stayMs(v,now))}분 체류</span>`;
  else st=`<span>${v.step===5?'채혈·'+(timed(v)?'연속':'일반'):esc(STEPS[v.step].name)}</span><span>${mins(curElapsed(v,now))}분</span>`;
  let bar='';
  for(let i=0;i<10;i++)bar+=`<i class="${v.step>i?'d':v.step===i?'c':''}"></i>`;
  let dl='';
  if(v.step===5&&timed(v)){
    const nx=pendDraws(v)[0];
    dl=v.lab.t0?(nx?`<span class="meta">다음 ${nx.off}분 채혈 <b data-due="${nx.due}"></b></span>`:`<span class="meta">채혈 모두 완료</span>`):`<span class="meta">${esc(PROTOS[v.lab.proto].name)} 시작 전</span>`;
  }else if(v.step>=8&&waitingAfterLeave(v)){const e=etaAll(v,now);dl=`<span class="meta">결과 대기 ${pendingItems(v).length}건${e?' · '+(etaIsExact(v,now)?'예상 ':'대략 ')+fmtEta(e,now):''}</span>${etaBar(v,now)}`}
  else if(v.step===6&&etaAll(v,now)){dl=`<span class="meta">결과 ${etaIsExact(v,now)?'예상 ':'대략 '}${fmtEta(etaAll(v,now),now)}</span>${etaBar(v,now)}`}
  else if(needNotify(v)){dl=`<span class="pill warn">결과 안내 필요</span>`}
  return `<button class="card${sel?' sel':''}${w?' warn':''}" data-sel="${v.id}">
    <span class="nm">${esc(v.name||'이름 없음')}${exTag(v)}${invTag(v)}${grPill(v)}</span>
    <span class="meta">${esc(age(v))}${v.sex?' · '+esc(v.sex):''}${v.chartNo?' · '+esc(v.chartNo):''}</span>
    <span class="st" style="${w?'color:var(--warn);font-weight:600':''}">${st}</span>
    ${dl}${v.step>=0&&v.step<10?`<span class="qd" role="button" data-act="quick-done" data-id="${v.id}" title="남은 단계를 건너뛰고 바로 완료 처리">바로 완료 ▸</span>`:''}<span class="bar">${bar}</span></button>`;
}
function notifyText(v){

    `<div class="nrow"><button class="lnk" data-sel="${v.id}">${esc(v.name)}</button><span class="meta">${esc(v.lab.items.join(', '))}${v.lab.items.some(k=>isExt(v,k))?' (수탁 포함)':''}</span>
    <span class="nbt"><button class="btn sm" data-act="copy-notify" data-id="${v.id}">안내 문구 복사</button><button class="btn sm primary" data-act="notified" data-id="${v.id}">안내 완료</button></span></div>`).join('');
  if(wait.length)h+=`<h3>귀가 후 결과 대기 <span class="pill">${wait.length}</span></h3>`+wait.map(v=>
    `<div class="nrow"><button class="lnk" data-sel="${v.id}">${esc(v.name)}</button><span class="meta">${pendingItems(v).map(k=>esc(k)+(isExt(v,k)?'(수탁)':'')).join(', ')}</span></div>`).join('');
  return h+'</div>';
}
function emptyHtml(){

function center(r){return {x:r.x+r.w/2,y:r.y+r.h/2}}

function pcolor(v){let h=0;const k=String(v.id||v.name||'');for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return 'hsl('+((h*137)%360)+',62%,40%)'}
function pathFor(v){
  const seq=[{room:'exit',step:-1}];

  (v.log||[]).forEach(l=>{if(l.s<=8)add(STEPS[l.s].room,l.s)});
  if(v.step>=9)add('exit',9);
  return seq;
}

const AL={key:'',sound:false,ctx:null,alerted:new Set(),primed:false};
function updateCountdowns(now){
  document.querySelectorAll('[data-due]').forEach(e=>{
    const l=Number(e.dataset.due)-now;
    e.textContent=fmtLeft(l);e.classList.toggle('late',l<=0);e.classList.toggle('soon',l>0&&l<=120000);
  });
}
function beep(n){
  if(!AL.sound||!AL.ctx)return;
  try{
    const c=AL.ctx;
    for(let i=0;i<n;i++){
      const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*0.35;
      o.frequency.value=i?1046:880;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.start(t);o.stop(t+0.32);
    }
  }catch(e){}
}
function toggleSound(){
  AL.sound=!AL.sound;
  if(AL.sound){try{AL.ctx=AL.ctx||new (window.AudioContext||window.webkitAudioContext)();AL.ctx.resume();beep(1)}catch(e){AL.sound=false;toast('이 화면에서는 소리를 켤 수 없습니다.')}}
  $('#btn-sound').textContent=AL.sound?'알람 소리 끄기':'알람 소리 켜기';
}
function renderAlarm(){
  const now=Date.now(),L=drawList(now),el=$('#alarm');
  const show=L.slice(0,8);
  const key=show.map(x=>x.v.id+':'+x.d.off).join('|');
  if(key!==AL.key){
    AL.key=key;
    el.innerHTML=show.length?`<div class="alarm"><b>채혈 일정</b>`+show.map(x=>
      `<div class="arow"><button class="lnk" data-sel="${x.v.id}">${esc(x.v.name)}</button><span class="meta">${x.d.off}분 채혈 · ${fmtT(x.d.due)}</span><b data-due="${x.d.due}"></b><button class="btn sm primary" data-act="draw-done" data-id="${x.v.id}" data-off="${x.d.off}">채혈 완료</button></div>`).join('')+`</div>`:'';
  }
  updateCountdowns(now);
  if(!S.loaded)return;
  if(!AL.primed){AL.primed=true;L.forEach(x=>{if(x.left<=0){const k=x.v.id+':'+x.d.off;AL.alerted.add(k+'d');AL.alerted.add(k+'p')}})}
  L.forEach(x=>{

    if(x.left<=0&&!AL.alerted.has(k+'d')){AL.alerted.add(k+'d');AL.alerted.add(k+'p');beep(2);toast(x.v.name+' '+x.d.off+'분 채혈 시간입니다.')}
    else if(x.left>0&&x.left<=120000&&!AL.alerted.has(k+'p')){AL.alerted.add(k+'p');beep(1);toast(x.v.name+' '+x.d.off+'분 채혈 2분 전')}
  });
}

/* ---------- 카드(QR) 시트 ---------- */
function cardUrl(code){
  const base=location.href.split('#')[0].split('?')[0],u=apiUrl();
  const m=u.match(/\/macros\/s\/([^/]+)\/exec/);
  return base+'?c='+encodeURIComponent(code)+(u?'&a='+(m?m[1]:encodeURIComponent(u)):'');
}
function qrData(text){
  const q=qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount();let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
  return {n:n,d:d};
}
function cardCodes(){
  const out=[],p=UI.cprefix,s=UI.cstart,c=Math.min(800,Math.max(1,UI.ccount));
  for(let i=0;i<c;i++)out.push(p+String(s+i).padStart(3,'0'));
  return out;
}
function cardSvg(code){
  const q=qrData(cardUrl(code)),m=q.n+4;
  return `<svg viewBox="-2 -2 ${m} ${m}" role="img" aria-label="${esc(code)}"><rect x="-2" y="-2" width="${m}" height="${m}" fill="#fff"/><path d="${q.d}" fill="#000"/></svg>`;
}
function sheetSvg(codes){
  /* A4 한 장 = 가로 5 × 세로 8 = 40장, 빼곡하게 (칸 42 × 37.125 mm) */
  const CW=42,CH=297/8,QS=27;
  let s='<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="sans-serif"><rect width="210" height="297" fill="#fff"/>';
  codes.forEach((code,i)=>{
    const x=(i%5)*CW,y=Math.floor(i/5)*CH,q=qrData(cardUrl(code)),sc=QS/(q.n+4);
    s+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" fill="none" stroke="#aaa" stroke-width="0.15" stroke-dasharray="1 1"/>`+
      `<g transform="translate(${x+(CW-QS)/2} ${y+2}) scale(${sc}) translate(2 2)"><rect x="-2" y="-2" width="${q.n+4}" height="${q.n+4}" fill="#fff"/><path d="${q.d}" fill="#000"/></g>`+
      `<text x="${x+CW/2}" y="${y+33.2}" font-size="4.6" font-weight="700" fill="#000" text-anchor="middle">${esc(code)}</text>`+
      `<text x="${x+CW/2}" y="${y+36}" font-size="2.1" fill="#555" text-anchor="middle">삼성자라다 · 폰 카메라로 찍어 주세요</text>`;
  });
  return s+'</svg>';
}
function cardsPreview(){
  if(typeof qrcode!=='function')return '<p class="hint">QR 생성 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.</p>';
  const codes=cardCodes(),pages=Math.ceil(codes.length/40);
  let btn='';
  for(let p=0;p<pages;p++)btn+=`<button class="btn sm" data-act="save-sheet" data-page="${p}">시트 ${p+1} 저장 (${p*40+1}~${Math.min(codes.length,p*40+40)}번째)</button> `;
  return `<div class="actions" style="margin:0 0 10px">${btn}</div><div class="cardgrid">${codes.slice(0,40).map(c=>`<div class="qc">${cardSvg(c)}<b>${esc(c)}</b></div>`).join('')}</div>${codes.length>40?'<p class="hint">미리보기는 첫 40장만 보입니다. 나머지는 시트 저장 버튼으로 받으세요.</p>':''}`;
}

/* ---------- 결과 예상 시각 ---------- */
function drawBase(v){
  if(timed(v)){const o=PROTOS[v.lab.proto].offs;return v.lab.t0?v.lab.t0+o[o.length-1]*60000:null}
  return stepStart(v,5)||null;
}
function etaExact(v,k){return !isExt(v,k)&&v.lab&&v.lab.eta&&v.lab.eta[k]?v.lab.eta[k]:null}
function extDay(v){const d=v.lab&&v.lab.extDate;if(!/^\d{4}-\d\d-\d\d$/.test(d||''))return null;const t=new Date(d+'T18:00:00').getTime();return isNaN(t)?null:t}
function fmtDay(ts,now){const d=new Date(ts),n=new Date(now),z=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),diff=Math.round((z(d)-z(n))/86400000);return (d.getMonth()+1)+'월 '+d.getDate()+'일'+(diff===0?' (오늘)':diff===1?' (내일)':'')}
function etaOf(v,k,now){
  if(isExt(v,k)&&extDay(v))return extDay(v);
  if(etaExact(v,k))return etaExact(v,k);
  const b=drawBase(v)||now,t=TAT[k]||{h:2,x:72};
  return b+(isExt(v,k)?t.x:t.h)*3600000;
}
function etaAll(v,now){const p=pendingItems(v);if(!p.length)return null;return Math.max(...p.map(k=>etaOf(v,k,now)))}
function etaIsExact(v,now){const p=pendingItems(v);return p.length>0&&p.every(k=>isExt(v,k)?false:!!etaExact(v,k))}
function etaBar(v,now){
  const e=etaAll(v,now);if(!e)return '';
  const b=drawBase(v)||stepStart(v,6)||now,pct=Math.max(3,Math.min(100,(now-b)/Math.max(1,e-b)*100));
  return `<span class="eb" title="결과까지 진행"><i style="width:${pct}%"></i></span>`;
}
function fmtEta(ts,now){
  const d=new Date(ts),n=new Date(now);
  const same=d.toDateString()===n.toDateString();
  return (same?'오늘 ':(d.getMonth()+1)+'/'+d.getDate()+' ')+fmtT(ts);
}
function fmtSpan(ms){
  const m=Math.round(ms/60000);if(m<=0)return '곧';
  if(m<60)return m+'분';
  if(m<60*24)return Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'');
  const d=Math.floor(m/1440),h=Math.round((m%1440)/60);return d+'일'+(h?' '+h+'시간':'');
}
function stepAvg(i,now){
  const d=list().filter(v=>v.step>i&&!(i===5&&timed(v))).map(v=>stepDur(v,i,now)).filter(x=>x!=null).map(mins);
  return d.length?d.reduce((a,b)=>a+b,0)/d.length:null;
}
const maskName=n=>{n=String(n||'').trim();return n.length<=1?n:n[0]+'○'.repeat(n.length-1)};
/* ---------- 환자 조회(키오스크) 화면 ---------- */
function kioskHtml(v){
  const now=Date.now();
  if(v.step<0)return `<h2>${esc(maskName(v.name))} 어린이</h2><p class="kbig">아직 접수 전입니다. 출입구에서 먼저 카드를 대 주세요.</p>`;
  const cur=Math.min(v.step,9);
  let rem=0,known=true;
  const rows=STEPS.slice(0,8).map((st,i)=>{
    if(skipStep(v,i))return '';
    const avg=stepAvg(i,now),done=v.step>i,on=v.step===i;
    if(!done){const a=avg==null?null:(on?Math.max(0,avg-mins(curElapsed(v,now))):avg);if(a==null)known=false;else rem+=a}
    return `<li class="${done?'d':on?'c':''}"><span>${done?'✓':on?'●':'○'}</span><span>${esc(st.name)}</span><span>${avg==null?'-':'평균 '+Math.round(avg)+'분'}</span></li>`;
  }).join('');
  let h=`<h2>${esc(maskName(v.name))} 어린이</h2>`;
  if(v.step<=7)h+=`<p class="kbig">지금 <b>${esc(STEPS[cur].name)}</b> · ${mins(curElapsed(v,now))}분째</p>`;
  else h+=`<p class="kbig">진료가 끝났습니다. 수납 후 귀가해 주세요.</p>`;
  h+=`<ol class="klist">${rows}</ol>`;
  if(v.step<=7&&known&&rem>0)h+=`<p>진료까지 남은 시간 약 <b>${Math.round(rem)}분</b> <span class="meta">(오늘 평균 기준)</span></p>`;
  const p=pendingItems(v);
  if(v.lab&&v.lab.items&&v.lab.items.length){
    if(!p.length)h+=`<p class="kbig">검사 결과가 모두 나왔습니다. 진료 시 확인해 주세요.</p>`;
    else{
      const inh=p.filter(k=>!isExt(v,k)),ext=p.filter(k=>isExt(v,k));
      h+='<div class="keta"><b>검사 결과 예상</b>';
      [[inh,'원내 검사'],[ext,'수탁 검사']].forEach(([a,l])=>{
        if(!a.length)return;
        const t=Math.max(...a.map(k=>etaOf(v,k,now)));
        const ex=a.every(k=>isExt(v,k)||etaExact(v,k));
        const isx=l==='수탁 검사';
        h+=`<div>${l}: ${isx?(extDay(v)?'대략 '+fmtDay(t,now)+'경':'결과 날짜는 곧 안내드립니다'):(t>now?(ex?'':'대략 ')+fmtEta(t,now)+'경 (약 '+fmtSpan(t-now)+' 후)':'곧 나옵니다')}${!ex&&!isx?' <span class="meta">검체 분석이 시작되면 정확한 시간을 안내합니다</span>':''}</div>`;
      });
      h+=etaBar(v,now)+'</div>';
    }
  }
  return h+kioskVideos(v);
}

          <div class="actions" style="margin:6px 0 0"><button type="button" class="btn sm" data-act="res-done" data-k="원내검사">결과 나옴</button></div>`:`<div class="actions" style="margin:0"><button type="button" class="btn sm ghost" data-act="res-undo" data-k="원내검사">되돌리기</button></div>`)+`</div>`;
      if(has('수탁검사'))h+=`<div class="sect" style="margin-top:6px"><h3>수탁검사 ${exP?'':'<span class="pill ok">결과 도착</span>'}</h3>`+
        (exP?`<label class="l">결과 예상 날짜 (대략)<input type="date" data-path="lab.extDate" value="${esc(v.lab.extDate||'')}"></label>
          <div class="actions" style="margin:6px 0 0"><button type="button" class="btn sm" data-act="res-done" data-k="수탁검사">결과 도착</button></div>`:`<div class="actions" style="margin:0"><button type="button" class="btn sm ghost" data-act="res-undo" data-k="수탁검사">되돌리기</button></div>`)+`</div>`;
      return h+`</div>`}
    case 7:return `<div class="f">${waitBanner(v,7)}<details class="more"><summary>진료 메모 (선택)</summary>
      <label class="l">판독 골연령<input type="text" data-path="review.boneAge" value="${esc(v.review.boneAge)}"></label>
      <label class="l">진료 소견<textarea data-path="review.note">${esc(v.review.note)}</textarea></label>
      <label class="l">다음 내원·추적 계획<input type="text" data-path="review.next" value="${esc(v.review.next)}"></label></details></div>`;
    case 8:return `<div class="f">${waitBanner(v,8)}<p class="hint" style="margin:0">수납이 끝나면 다음 단계로 넘기세요.</p></div>`;
    case 9:return `<div class="f"><pre class="report" id="report-pre">${esc(reportText(v))}</pre>
      <div class="actions" style="margin-top:0"><button class="btn" data-act="copy-report">리포트 복사</button></div>
      <p class="hint">이 앱에서 문자나 알림톡이 직접 발송되지는 않습니다. 복사해서 보낸 뒤 아래에서 발송 완료로 표시하세요.${v.step>8&&v.report.sentAt?' 발송 처리 '+fmtT(v.report.sentAt):''}</p></div>`;
  }
  return '';
}
function timelineHtml(v){
  const now=Date.now();
  const items=(v.log||[]).filter(l=>l.s<=9).map(l=>{
    const st=STEPS[l.s],d=stepDur(v,l.s,now),w=d!=null&&warnAt(v,l.s)&&mins(d)>warnAt(v,l.s);
    return `<li><time>${fmtT(l.t)}</time><span>${esc(st.name)}${l.s<9?` <span class="rm">${ROOMS[st.room].label}</span>`:''}</span><span class="du${w?' w':''}">${d==null?'':mins(d)+'분'}${v.step===l.s&&v.step<9?' 진행 중':''}</span></li>`;
  });
  return items.length?`<ul class="tl">${items.join('')}</ul>`:'<p class="hint">도착 처리하면 동선 기록이 시작됩니다.</p>';
}
function detailHtml(){
  if(UI.adding)return addFormHtml();
  const v=UI.sel?S.items.get(UI.sel):null;
  if(!v)return `<div class="empty"><h2>환자를 선택하세요</h2><p>현황판이나 지도에서 환자를 누르면 단계별 입력과 동선 기록이 여기에 열립니다.</p></div>`;
  const now=Date.now(),vs=UI.viewStep==null?Math.min(Math.max(v.step,0),9):UI.viewStep;
  const w=isWarn(v,now);
  let stepper='';
  for(let i=0;i<10;i++){
    const cls=(v.step>i?'d':v.step===i?'c':'')+(v.step===i&&w?' warn':'')+(vs===i?' v':'');
    stepper+=`<button class="${cls}" data-view-step="${i}"${skipStep(v,i)?' style="opacity:.45;text-decoration:line-through" title="재진 환자는 건너뜁니다"':''}><b>${i+1}</b>${STEPS[i].short}</button>`;
  }
  let head=`<div class="dh"><div><h2>${esc(v.name||'이름 없음')}${exTag(v)}</h2>
    <div class="sub">${esc(age(v))}${v.sex?' · '+esc(v.sex):''}${v.chartNo?' · 등록번호 '+esc(v.chartNo):''}${v.appt?' · 예약 '+esc(v.appt):''}</div></div>
    <button class="btn sm ghost" data-act="close">닫기</button></div>
    <details class="more" style="margin-top:8px"><summary>초진·대기 영상 설정${v.first?' (초진)':''}${v.rev?' (재진)':''}${v.vids?' · 영상 '+esc(v.vids):''}</summary>
    <label class="chk" style="margin-top:8px"><input type="checkbox" data-path="first"${v.first?' checked':''}>초진 환자 (대기 중 영상 표시)</label>
    <label class="chk" style="margin-top:8px"><input type="checkbox" data-path="rev"${v.rev?' checked':''}>재진 환자 (초진방 링크 단계 건너뜀)</label>
    <label class="l" style="margin-top:8px">초진 안내 문자 붙여넣기<textarea data-paste rows="2" placeholder="1순위) 1. … 2순위) 7. …"></textarea></label>
    <label class="l" style="margin-top:8px">대기 영상 번호 (예: 172)<input type="text" data-path="vids" inputmode="numeric" maxlength="7" value="${esc(v.vids||'')}" placeholder="초진 접수에서 고른 영상 번호"></label></details>
    ${xvPanel(v)}
    <label class="l" style="margin-top:8px">카드 번호<input type="text" data-card value="${esc(v.card||'')}" placeholder="카드를 스캔하세요" autocomplete="off"></label>`;
  if(v.step<0){
    return head+`<div class="sect"><p style="margin:0 0 10px">아직 도착 전입니다. 보호자와 함께 내원하면 도착 처리하세요.</p>
      <div class="actions" style="margin-top:0"><button class="btn primary" data-act="arrive">내원 확인 (도착 처리)</button>${delBtn(v)}</div></div>`;
  }
  const cur=v.step;
  let status='';
  if(cur<10)status=`<span class="pill${w?' warn':''}">${esc(STEPS[cur].name)} · ${mins(curElapsed(v,now))}분${w?' (기준 '+warnAt(v,cur)+'분 초과)':''}</span>`;
  else status=`<span class="pill ok">리포트 발송 완료 · 총 체류 ${mins(stayMs(v,now))}분</span>`;
  let act='';
  if(cur<10){
    const nextName=cur<9?STEPS[cur+(skipStep(v,cur+1)?2:1)].name:'발송 완료';
    act=`<div class="actions">${cur>=0?`<button class="btn ghost" data-act="back">이전 단계로</button>`:''}
      <button class="btn" data-act="gr-open">📄 성장 리포트${grMark(v)}</button><button class="btn" data-act="quick-done" title="남은 단계를 건너뛰고 바로 완료 처리">바로 완료 처리</button>
      <button class="btn primary" data-act="next">${cur<9?'완료 → 다음: '+esc(nextName):'리포트 발송 완료로 표시'}</button>
      ${UI.msg?`<span class="msg" role="alert">${esc(UI.msg)}</span>`:''}
      ${UI.msg&&UI.force===v.id?`<button class="btn ghost" data-act="next-force">그래도 넘기기</button>`:''}</div>`;
  }else act=`<div class="actions"><button class="btn" data-act="gr-open">📄 성장 리포트${grMark(v)}</button><button class="btn ghost" data-act="back">${v.quickFrom!=null?'완료 취소 (원래 단계로)':'발송 표시 취소'}</button></div>`;
  return head+`<div style="margin-top:8px">${status}</div><div class="stepper" role="group" aria-label="단계">${stepper}</div>
    <div class="sect" style="margin-top:0;border-top:0;padding-top:0"><h3>${vs+1}. ${esc(STEPS[vs].name)}${vs!==cur&&cur<10?' <span class="pill ex">지난·다음 단계 보기</span>':''}</h3>${stepForm(v,vs)}</div>${act}
    <div class="sect"><h3>동선 기록</h3>${timelineHtml(v)}</div>
    <div class="sect actions" style="margin-top:12px">${delBtn(v)}</div>`;
}
function delBtn(v){
  return UI.confirmDel===v.id
    ?`<button class="btn danger sm" data-act="del-yes">정말 삭제</button><button class="btn sm ghost" data-act="del-no">취소</button>`
    :`<button class="btn sm ghost" data-act="del">이 환자 기록 삭제</button>`;
}

/* ---------- 렌더 ---------- */
function detailFocused(){const a=document.activeElement;return !!(a&&$('#detail').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
function renderMain(){
  const el=$('#main-view');
  if(!S.loaded){el.innerHTML='<div class="empty"><p>환자 기록을 불러오는 중입니다…</p></div>';return}
  if(UI.view==='cards'){if(!el.querySelector('[data-cc]'))el.innerHTML=renderCards();return}
  if(UI.view==='flow'){if(!el.querySelector('[data-fl]'))el.innerHTML=renderFlow();return}
  if(UI.view==='report'){el.innerHTML=FR.listHtml();return}
  el.innerHTML=UI.view==='board'?renderBoard():UI.view==='map'?(typeof renderMapView==='function'?renderMapView():renderMap()):renderStats();
  if(UI.view==='map'&&typeof afterMap==='function')afterMap();
}
function renderDetail(force){
  if(!force&&detailFocused())return;
  $('#detail').innerHTML=detailHtml();
  updateCountdowns(Date.now());
}
function renderAll(force){
  if(UI.sel&&!S.items.has(UI.sel))UI.sel=null;
  renderSummary();renderMain();renderDetail(force);renderAlarm();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===UI.view)));
}
function tickClock(){
  const d=new Date(),dw='일월화수목금토'[d.getDay()];
  $('#clock').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${dw}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- 동작 ---------- */
function select(id){
  UI.sel=id;UI.viewStep=null;UI.adding=false;UI.confirmDel=null;UI.msg='';UI.force=null;renderAll(true);
  if(window.matchMedia('(max-width:980px)').matches)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function advance(v,force){
  const b=force?null:blocker(v);if(b){UI.msg=b;UI.force=v.id;UI.viewStep=null;renderDetail(true);return}
  UI.force=null;
  const now=Date.now();UI.msg='';UI.viewStep=null;
  if(v.step===4)v.xray.done=true;if(v.step===5)v.lab.drawn=true;if(v.step===8)v.exit.paid=true;
  if(v.step===9){v.step=10;v.log.push({s:10,t:now});v.report.sent=true;v.report.sentAt=now;toast(v.name+': 리포트 발송 완료로 표시했습니다.')}
  else{v.step++;if(skipStep(v,v.step))v.step++;v.log.push({s:v.step,t:now});toast(`${v.name}: ${STEPS[v.step].name} 단계로 이동`)}
  put(v,true);renderAll(true);
}
function grMark(v){return v.gr&&v.gr.ready?(v.gr.reviewed?' ✓':' (확인 전)'):''}
function grPill(v){return v.gr&&v.gr.ready?(v.gr.reviewed?'<span class="pill ok">리포트 ✓</span>':'<span class="pill warn">리포트 확인 전</span>'):''}
/* 바로 완료: 남은 단계(계측·X-ray·채혈·진료·수납 등)를 건너뛰고 완료로 보냅니다. 되돌리면 원래 단계로 돌아갑니다. */
function quickDone(v){
  if(!v||v.step<0||v.step>=10)return;
  if(!confirm((v.name||'이 환자')+' 환자를 지금 바로 완료 처리할까요?\n(남은 단계를 건너뜁니다. 상세 화면의 \'완료 취소\'로 되돌릴 수 있어요.)'))return;
  const now=Date.now();
  v.quickFrom=v.step;
  [8,9].forEach(s=>{if(v.step<s)v.log.push({s:s,t:now})});
  v.log.push({s:10,t:now});
  v.step=10;v.report.sent=true;v.report.sentAt=now;
  UI.msg='';UI.force=null;UI.viewStep=null;
  put(v,true);renderAll(true);toast((v.name||'환자')+': 바로 완료 처리했습니다.');
}
function rewind(v){
  if(v.step===10&&v.quickFrom!=null){
    const f=v.quickFrom;v.log=v.log.filter(l=>l.s<=f);v.report.sent=false;delete v.report.sentAt;v.step=f;v.quickFrom=null;
    UI.msg='';UI.force=null;UI.viewStep=null;put(v,true);renderAll(true);return;
  }
  v.log=v.log.filter(l=>l.s!==v.step);
  if(v.step===10){v.report.sent=false;delete v.report.sentAt}
  v.step--;if(skipStep(v,v.step))v.step--;UI.msg='';UI.force=null;UI.viewStep=null;put(v,true);renderAll(true);
}
function onAction(act,el){
  const id=el&&el.dataset?el.dataset.id:null;
  const v=(id&&S.items.get(id))||(UI.sel?S.items.get(UI.sel):null);
  switch(act){
    case 'add':UI.adding=true;renderDetail(true);$('#detail').scrollIntoView({block:'nearest'});setTimeout(()=>{const n=$('#af-name');n&&n.focus()},50);break;
    case 'lookup':lookupPatients();break;
    case 'inv-send':ivSend();break;
    case 'pick-match':pickMatch(Number(el.dataset.i));break;
    case 'logout':logout();break;
    case 'save-flow':{const c=readFlow();applyFlow(c);saveFlow(c);$('#main-view').innerHTML='';renderAll(true);toast('동선 설정을 저장했습니다.');break}
    case 'reset-flow':{applyFlow(DEF);saveFlow(DEF);$('#main-view').innerHTML='';renderAll(true);toast('기본값으로 되돌렸습니다.');break}
    case 'cancel-add':UI.adding=false;renderDetail(true);break;
    case 'close':UI.sel=null;renderAll(true);break;
    case 'arrive':if(v){v.step=0;v.log=[{s:0,t:Date.now()}];put(v,true);renderAll(true)}break;
    case 'next':if(v)advance(v);break;
    case 'next-force':if(v)advance(v,true);break;
    case 'xv':if(v){const n=String(el.dataset.n),c=String(v.xv||'').split('').filter(Boolean);const k=c.indexOf(n);if(k>=0)c.splice(k,1);else c.push(n);v.xv=c.sort().join('');put(v,true);renderDetail(true)}break;
    case 'back':if(v)rewind(v);break;
    case 'del':UI.confirmDel=UI.sel;renderDetail(true);break;
    case 'del-no':UI.confirmDel=null;renderDetail(true);break;
    case 'del-yes':if(v){const i=v.id;UI.sel=null;UI.confirmDel=null;remove(i);renderAll(true)}break;
    case 'gr-open':{const i=id||(v&&v.id);if(i)FR.open(i);break}
    case 'gr-print':{const i=id||(v&&v.id);if(i)FR.print(i);break}
    case 'quick-done':if(v)quickDone(v);break;
    case 'sound':toggleSound();break;
    case 'res-done':{const k=el.dataset.k;if(!v||!k)break;if(!v.lab.results)v.lab.results={};if(!v.lab.at)v.lab.at={};v.lab.results[k]='완료';v.lab.at[k]=Date.now();put(v,true);renderAll(true);break}
    case 'res-undo':{const k=el.dataset.k;if(!v||!k)break;if(v.lab.results)delete v.lab.results[k];if(v.lab.at)delete v.lab.at[k];put(v,true);renderAll(true);break}
    case 'set-eta':{const m=parseInt(($('#eta-min')||{}).value,10);if(!v||!m||m<1){toast('분을 입력해 주세요.');break}
      if(!v.lab.eta)v.lab.eta={};const t=Date.now()+m*60000;
      pendingItems(v).forEach(k=>{if(!isExt(v,k))v.lab.eta[k]=t});put(v,true);renderAll(true);toast('예상 완료 '+fmtT(t)+'로 기록했습니다.');break}
    case 'add-video':{const c=$('#vrows');if(c)c.insertAdjacentHTML('beforeend',videoRow());break}
    case 'del-video':{const r=el.closest('.vrow');if(r)r.remove();break}
    case 'start-draw':if(v&&timed(v)){startDraws(v);put(v,true);renderAll(true);renderAlarm()}break;
    case 'draw-done':{
      const off=Number(el.dataset.off),d=v&&(v.lab.draws||[]).find(x=>x.off===off);
      if(d&&!d.done){d.done=Date.now();put(v,true);renderAll(true);renderAlarm();toast(v.name+' '+off+'분 채혈 완료')}
      break}
    case 'notified':if(v){v.notifiedAt=Date.now();put(v,true);toast(v.name+' 안내 완료로 표시했습니다.')}break;
    case 'copy-notify':{
      const txt=v?notifyText(v):'';
      try{navigator.clipboard.writeText(txt).then(()=>toast('안내 문구를 복사했습니다.'),()=>toast(txt))}catch(e){toast(txt)}
      break}
    case 'save-sheet':saveSheet(Number(el.dataset.page));break;
    case 'copy-report':{
      const txt=v?reportText(v):'';
      const fb=()=>{const p=$('#report-pre');if(p){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('텍스트를 선택했습니다. 복사해 주세요.')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('리포트를 복사했습니다.'),fb)}catch(e){fb()}
      break}
  }
}
/* ---------- 스캔 단말 ---------- */
const STATION_KEY='jarada-flow-station';
/* 스캐너 접두어 → 방. 스캐너 설정에서 접두어를 'B-' 처럼 지정하면 카드를 찍을 때 'B-C001' 로 들어옵니다. */
const PREFIX_ROOM={W:'wait',F:'fluid',P:'clin',B:'lab',X:'xray',D:'doctor',E:'exit'};
function prefixLegend(){return Object.keys(PREFIX_ROOM).filter(k=>ROOMS[PREFIX_ROOM[k]]).map(k=>k+'- '+ROOMS[PREFIX_ROOM[k]].label).join(' · ')}
function focusScan(){const s=$('#scan');if(!s.hidden)s.focus()}
function setStation(val,save){
  $('#station').value=val;$('#scan').hidden=!val;$('#labmode-wrap').hidden=!(val==='lab'||val==='multi');$('#pfx-legend').hidden=val!=='multi';
  if(save){try{localStorage.setItem(STATION_KEY,val)}catch(e){}}
  if(val==='multi')$('#pfx-legend').textContent='스캐너 접두어: '+prefixLegend();
  if(val)focusScan();else $('#scan-msg').textContent='';
}
function scanMsg(t,bad){
  const m=$('#scan-msg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)';
  clearTimeout(scanMsg.t);scanMsg.t=setTimeout(()=>{m.textContent=''},7000);
}
function findByCard(code){
  const c=code.trim().toLowerCase();
  const act=list().filter(v=>v.step<10).sort((a,b)=>b.createdAt-a.createdAt);
  /* 카드 번호가 먼저, 없으면 EMR 라벨 등으로 읽은 등록번호로 찾습니다 */
  return act.find(v=>v.card&&v.card.toLowerCase()===c)||act.find(v=>v.chartNo&&String(v.chartNo).toLowerCase()===c);
}
function handleScan(raw){
  let code=raw.trim();if(!code)return;
  if(/^https?:\/\//i.test(code)){try{code=new URL(code).searchParams.get('c')||code}catch(e){}}
  /* 지속 스캔 모드에서 같은 카드가 연속으로 읽히는 경우를 한 번만 처리 */
  const tnow=Date.now();
  if(handleScan.last===code&&tnow-handleScan.t<4000){handleScan.t=tnow;return}
  handleScan.last=code;handleScan.t=tnow;
  const sel=$('#station').value;
  let st=sel;
  /* 접두어(예: B-C001)가 있으면 그 방으로 처리하고 카드 번호만 남깁니다 (키오스크는 방을 정하지 않으므로 무시) */
  const pm=code.match(/^([WFPBXDE])\s*-\s*(.+)$/i);
  if(pm&&PREFIX_ROOM[pm[1].toUpperCase()]&&ROOMS[PREFIX_ROOM[pm[1].toUpperCase()]]){
    code=pm[2].trim();
    if(sel!=='kiosk')st=PREFIX_ROOM[pm[1].toUpperCase()];
  }
  else if(sel==='multi'){scanMsg('방 접두어가 없는 스캔입니다: '+code+' · 스캐너 설정을 확인해 주세요 ('+prefixLegend()+')',true);return}
  if(!st){scanMsg('이 단말의 위치를 먼저 선택해 주세요.',true);return}
  if(st==='kiosk'){
    const kv=findByCard(code)||list().filter(x=>x.card&&x.card.toLowerCase()===code.toLowerCase()).sort((a,b)=>b.createdAt-a.createdAt)[0];
    if(!kv){scanMsg('연결된 환자가 없는 카드입니다.',true);return}
    showKiosk(kv);return;
  }
  if(!S.canWrite){scanMsg('보기 전용 화면에서는 기록할 수 없습니다.',true);return}
  const v=findByCard(code);
  if(!v){scanMsg('연결된 환자가 없는 카드입니다: '+code,true);return}
  const now=Date.now();
  if(v.step<0){
    if(st!=='exit'){scanMsg(v.name+': 아직 도착 전입니다. 출입구에서 먼저 스캔해 주세요.',true);return}
    v.step=0;v.log=[{s:0,t:now}];put(v,true);scanMsg(v.name+' 도착 · 대기실로 안내해 주세요.');return;
  }
  if(v.step>=9){scanMsg(v.name+': 이미 귀가 처리된 환자입니다.',true);return}
  if(st==='lab'&&v.step<=5){
    const mode=$('#labmode').value;
    if(mode!=='single'&&!(timed(v)&&v.lab.t0)){
      v.lab.proto=mode;applyProtoDefaults(v,mode);startDraws(v);
      if(v.step<5){v.step=5;v.log.push({s:5,t:now})}
      put(v,true);renderAll(true);renderAlarm();
      scanMsg(v.name+' · '+PROTOS[mode].name+' 시작 · 채혈 예정 '+v.lab.draws.filter(d=>!d.done).map(d=>d.off+'분 '+fmtT(d.due)).join(', '));return;
    }
  }
  if(v.step===5&&timed(v)&&v.lab.t0&&st==='lab'){
    const d=pendDraws(v)[0];
    if(d){d.done=now;put(v,true);renderAlarm();scanMsg(v.name+' '+d.off+'분 채혈 기록'+(pendDraws(v).length?'':' · 마지막 채혈입니다.'));return}
  }
  let target=-1;
  if(st==='exit'&&v.step===8)target=9;
  else if(STEPS[v.step].room===st){
    if(v.step<8&&STEPS[v.step+1].room===st&&!skipStep(v,v.step+1))target=v.step+1;
    else{scanMsg(v.name+': 이미 '+STEPS[v.step].name+' 단계입니다.',true);return}
  }
  else for(let i=v.step+1;i<=8;i++){if(STEPS[i].room===st&&!skipStep(v,i)){target=i;break}}
  if(target<0){scanMsg(v.name+': '+ROOMS[st].label+'(으)로 이동할 단계가 남아 있지 않습니다.',true);return}
  if(v.step===5&&timed(v)){
    if(!v.lab.t0){scanMsg(v.name+': 자극검사 시작 전입니다. 채혈실에서 검사를 시작해 주세요.',true);return}
    const n=pendDraws(v).length;if(n){scanMsg(v.name+': 남은 채혈 '+n+'회가 있습니다. 끝난 뒤 이동해 주세요.',true);return}
  }
  const skipped=target-v.step>1&&target<9;
  v.step=target;v.log.push({s:target,t:now});put(v,true);
  scanMsg(v.name+' → '+STEPS[target].name+(skipped?' (중간 단계 건너뜀)':''));
}

/* ---------- 접수자 명부: 의사 앱이 EMR 붙여넣기마다 모아 둔 「차트번호 → 이름·나이」 ---------- */
const CDIR={map:null,srv:null};
function cdLocal(){if(!CDIR.map){try{CDIR.map=JSON.parse(ls.get('jrd_chartdir')||'{}')}catch(e){CDIR.map={}}}return CDIR.map}
async function cdServer(){
  if(CDIR.srv)return CDIR.srv;
  CDIR.srv={};const url=apiUrl(),key=ls.get('jrd_sync_key');if(!url||!key)return CDIR.srv;
  try{
    const rows=await(await fetch(url+'?key='+encodeURIComponent(key))).json();
    const parts=(Array.isArray(rows)?rows:[]).filter(x=>x.type==='chartdir').map(x=>{try{return JSON.parse(x.question)}catch(e){return null}}).filter(Boolean);
    const set=parts.length?parts.sort((a,b)=>String(a.set)<String(b.set)?1:-1)[0].set:'';
    parts.filter(p=>p.set===set).forEach(p=>String(p.data||'').split('\n').forEach(l=>{const f=l.split('|');if(f.length>=5&&f[0])CDIR.srv[f[0]]=f.slice(1)}));
  }catch(e){}
  return CDIR.srv;
}
async function cdFind(chart){
  const c=String(chart||'').replace(/\D/g,'');if(c.length<4)return null;
  let r=cdLocal()[c];if(!r){const s=await cdServer();r=s[c]}
  if(!r)return null;
  let age=null;if(r[1]){const b=new Date(r[1]+'T00:00:00'),t=new Date();if(!isNaN(b)){age=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))age--}}
  return {name:r[0],age:age,sex:r[2]==='M'?'남':r[2]==='F'?'여':'',chartNo:c,first:false,vids:'',fromDir:true};
}
/* ---------- 오늘 예약 명부: 의사 앱에 붙여넣은 「오늘 예약 환자」를 이름·등록번호로 대조해 예약 칸에 자동 등록 ---------- */
const RV={busy:false,t:0};
const todayYmd=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
async function resvSync(force){
  const say=t=>{if(force)toast(t)};
  if(RV.busy){return}
  if(!S.loaded||!authToken()){say('아직 로그인·불러오기 중이에요. 잠시 후 다시 눌러 주세요.');return}
  if(!force&&Date.now()-RV.t<25000)return;
  RV.busy=true;RV.t=Date.now();
  try{
    const td=todayYmd();
    let parts=[];
    try{const lo=JSON.parse(ls.get('jrd_todayresv')||'null');if(lo&&lo.v===2&&lo.data)parts.push(lo)}catch(e){}
    const url=apiUrl(),key=ls.get('jrd_sync_key');
    if(url&&key){
      try{
        const rows=await(await fetch(url+'?key='+encodeURIComponent(key))).json();
        (Array.isArray(rows)?rows:[]).filter(x=>x.type==='todayresv').forEach(x=>{try{const p=JSON.parse(x.question);if(p&&p.v===2)parts.push(p)}catch(e){}});
      }catch(e){}
    }
    if(!parts.length){say('올려 둔 예약 명단이 없어요. 의사 앱에서 「예약 환자 올리기」를 먼저 해 주세요.');return}
    const set=parts.sort((a,b)=>String(a.set)<String(b.set)?1:-1)[0].set;
    const items=[];
    parts.filter(p=>p.set===set).forEach(p=>String(p.data||'').split('\n').forEach(l=>{const f=l.split('|');if(f[0]===td&&f[2])items.push({chart:(f[1]||'').replace(/\D/g,''),name:f[2].trim(),time:f[3]||''})}));
    if(!items.length){say('오늘('+td.slice(5)+') 날짜 예약이 올려 둔 명단에 없어요.');return}
    let doneKey='flow_resv_done_'+td,done=[];try{done=JSON.parse(ls.get(doneKey)||'[]')}catch(e){}
    const today=[...S.items.values()].filter(v=>v.date===td);
    let n=0,had=0;
    for(const r of items){
      const k=r.chart||r.name;
      if(!force&&done.includes(k))continue;
      const dup=today.find(v=>(r.chart&&v.chartNo&&String(v.chartNo).replace(/\D/g,'')===r.chart)||(v.name&&v.name.replace(/\s/g,'')===r.name.replace(/\s/g,'')));
      if(!done.includes(k))done.push(k);
      if(dup){had++;continue}
      const d=r.chart?await cdFind(r.chart):null;
      const v=newVisit({id:'resv_'+td+'_'+k,name:r.name,chartNo:r.chart,age:d&&d.age!=null?d.age:'',sex:(d&&d.sex)||'여',appt:r.time,rev:!!d,first:false,fromResv:true});
      put(v,true);n++;
    }
    ls.set(doneKey,JSON.stringify(done));
    if(n)toast('오늘 예약 환자 '+n+'명을 예약 칸에 넣었어요.');
    else say('예약 '+items.length+'명 중 새로 넣을 환자가 없어요 (이미 '+had+'명 등록됨).');
  }catch(e){say('예약을 불러오지 못했어요: '+(e&&e.message||e))}
  finally{RV.busy=false}
}
const LK={m:[]};
async function lookupPatients(){
  const chart=$('#af-chart').value.trim(),name=$('#af-name').value.trim(),phone=$('#af-phone').value.trim(),box=$('#lk-res');
  if(!chart&&!name&&phone.replace(/\D/g,'').length<4){box.textContent='등록번호, 이름, 전화번호 중 하나를 입력해 주세요.';return}
  box.textContent='찾는 중…';
  try{
    const j=await api({action:'flowlookup',chartNo:chart,name:name,phone:phone});
    if(!j||j.status!=='ok'){box.textContent=(j&&j.message)||'찾지 못했습니다.';return}
    if(!Array.isArray(j.matches)){S.halt=true;showConn(HALT_MSG);box.textContent='서버가 환자 찾기를 아직 모릅니다. Apps Script에 Flow 파일과 Code.gs 한 줄이 들어갔는지, 배포 관리에서 새 버전으로 배포했는지 확인해 주세요.';return}
    LK.m=j.matches;
    if(!LK.m.length&&chart){const d=await cdFind(chart);if(d){LK.m=[d];pickMatch(0);return}}
    if(!LK.m.length){box.textContent='의사 앱에 없는 번호예요. 새 초진 환자라면 이름 없이 그대로 도착 처리하세요. 초진기록지 다음 단계에서 EMR을 붙여넣으면 이름·연락처를 찾아 초진방 링크를 보내요.';return}
    if(LK.m.length===1){pickMatch(0);return}
    box.innerHTML=LK.m.map((m,i)=>`<button type="button" class="btn sm" data-act="pick-match" data-i="${i}">${esc(m.name)} · ${m.age==null?'-':'만 '+m.age+'세'} ${esc(m.sex)} · ${esc(m.chartNo||'등록번호 없음')} · ···${esc(m.phoneTail)}</button>`).join('');
  }catch(e){if(e&&e.code==='HALT')box.textContent='서버 설정이 끝나지 않아 멈췄습니다. 위 안내를 확인하고 새로고침해 주세요.';else if(!e||e.code!=='AUTH_REQUIRED')box.textContent='서버에 연결하지 못했습니다.'}
}

function m3Sync(){

/* ---- 성장곡선(캔버스) ---- */
function drawChart(cv,m){
  var ctx=cv.getContext('2d'),W=706,H=318,sc=2;cv.width=W*sc;cv.height=H*sc;ctx.setTransform(sc,0,0,sc,0,0);
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
  var sex=m.st.sex,L=44,R=38,T=22,B=36;
  var minAge=Math.min.apply(null,m.recs.map(function(r){return r.ageM}));
  var xs=Math.max(0,Math.floor(minAge/12)-1)*12,xe=228;if(xe-xs<60)xs=Math.max(0,xe-60);
  var pcts=[3,10,25,50,75,90,97],cv2={};pcts.forEach(function(p){cv2[p]=[]});
  var ms=[];for(var a=xs;a<227;a+=3)ms.push(a);ms.push(227);
  ms.forEach(function(a){pcts.forEach(function(p){cv2[p].push([a,valAt('height',sex,a,p)])})});
  var lo=cv2[3][0][1],hi=cv2[97][cv2[97].length-1][1];
  m.recs.forEach(function(r){lo=Math.min(lo,r.h);hi=Math.max(hi,r.h)});if(m.pred)hi=Math.max(hi,m.pred.v);
  var yMin=Math.floor((lo-4)/10)*10,yMax=Math.ceil((hi+4)/10)*10;
  var fx=function(a){return L+(a-xs)/(xe-xs)*(W-L-R)},fy=function(v){return T+(yMax-v)/(yMax-yMin)*(H-T-B)};
  var font=function(w,s){return w+' '+s+'px "IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'};
  ctx.lineWidth=1;ctx.strokeStyle='#E7ECEF';ctx.fillStyle='#6B7B85';ctx.font=font(400,10.5);ctx.textAlign='right';ctx.textBaseline='middle';
  for(var y=yMin;y<=yMax;y+=10){ctx.beginPath();ctx.moveTo(L,fy(y));ctx.lineTo(W-R,fy(y));ctx.stroke();ctx.fillText(String(y),L-7,fy(y))}
  ctx.textAlign='center';ctx.textBaseline='top';
  for(var yr=Math.ceil(xs/12);yr<=19;yr++){var x=fx(Math.min(yr*12,228));ctx.strokeStyle='#EFF2F4';ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,H-B);ctx.stroke();if(yr%2===0){ctx.fillStyle='#6B7B85';ctx.fillText(String(yr),x,H-B+6)}}
  ctx.fillStyle='#6B7B85';ctx.font=font(500,10.5);ctx.textAlign='center';ctx.fillText('만 나이 (세)',(L+W-R)/2,H-15);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('키 (cm)',4,12);
  ctx.beginPath();cv2[3].forEach(function(p,i){i?ctx.lineTo(fx(p[0]),fy(p[1])):ctx.moveTo(fx(p[0]),fy(p[1]))});
  for(var k=cv2[97].length-1;k>=0;k--)ctx.lineTo(fx(cv2[97][k][0]),fy(cv2[97][k][1]));
  ctx.closePath();ctx.fillStyle='rgba(11,110,127,0.07)';ctx.fill();
  pcts.forEach(function(p){
    ctx.beginPath();cv2[p].forEach(function(pt,i){i?ctx.lineTo(fx(pt[0]),fy(pt[1])):ctx.moveTo(fx(pt[0]),fy(pt[1]))});
    ctx.strokeStyle=p===50?'#5F7C89':(p===3||p===97)?'#A9BAC3':'#C9D5DB';ctx.lineWidth=p===50?1.8:1.1;ctx.stroke();
    var e=cv2[p][cv2[p].length-1];ctx.fillStyle=p===50?'#3F5B68':'#7D8E98';ctx.font=font(p===50?600:400,10);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(String(p),fx(e[0])+5,fy(e[1]));
  });
  ctx.fillStyle='#7D8E98';ctx.font=font(400,10);ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText('백분위',W-R-6,12);
  var pts=m.recs.map(function(r){return[fx(r.ageM),fy(r.h)]}),last=pts[pts.length-1];
  if(m.pred){ctx.setLineDash([5,4]);ctx.strokeStyle='#0B6E7F';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(fx(ADULT_M),fy(m.pred.v));ctx.stroke();ctx.setLineDash([])}
  ctx.strokeStyle='#0B6E7F';ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.stroke();
  pts.forEach(function(p,i){
    var isLast=i===pts.length-1;ctx.beginPath();ctx.arc(p[0],p[1],isLast?6:4,0,Math.PI*2);ctx.fillStyle=isLast?'#0B6E7F':'#FFFFFF';ctx.fill();
    ctx.lineWidth=isLast?2.5:2;ctx.strokeStyle=isLast?'#FFFFFF':'#0B6E7F';ctx.stroke();
    if(isLast){ctx.beginPath();ctx.arc(p[0],p[1],6,0,Math.PI*2);ctx.lineWidth=1.2;ctx.strokeStyle='#0B6E7F';ctx.stroke()}
  });
  ctx.fillStyle='#0B6E7F';ctx.font=font(700,12);ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(m.cur.h+' cm',last[0],last[1]-12);
  if(m.pred){var qx=fx(ADULT_M),qy=fy(m.pred.v);ctx.save();ctx.translate(qx,qy);ctx.rotate(Math.PI/4);ctx.fillStyle='#FFFFFF';ctx.fillRect(-6,-6,12,12);ctx.lineWidth=2.2;ctx.strokeStyle='#B5651D';ctx.strokeRect(-6,-6,12,12);ctx.restore();
    ctx.fillStyle='#B5651D';ctx.font=font(700,12);ctx.textAlign='right';ctx.fillText('예측 '+m.pred.v+' cm',qx-11,qy-12)}
}

function pickVideos(text,pre){
  var t=String(text||''),sc={},add=function(n,w){sc[n]=(sc[n]||0)+w};
  if(/성조숙|조발|사춘기|GnRH|가슴\s*(멍울|몽우리)|유방/i.test(t)){add(4,3);add(3,2);add(5,1)}
  if(/저신장|성장호르몬|\bGH\b|성장\s*(둔화|지연|속도)|키\s*작/i.test(t)){add(5,3);add(1,2)}
  if(/병행/.test(t))add(6,3);
  if(/비만|과체중|인슐린|대사|BMI/i.test(t)){add(7,3)}
  if(/혈액|검사|lab|BA\b|골연령/i.test(t))add(3,1);
  var ex={};String(pre||'').replace(/[1-7]/g,function(n){ex[n]=1});
  var prio=[3,4,5,6,7,1,2];
  var nos=Object.keys(sc).map(Number).filter(function(n){return !ex[n]}).sort(function(a,b){return sc[b]-sc[a]||prio.indexOf(a)-prio.indexOf(b)}).slice(0,3);
  if(nos.length<3&&nos.indexOf(2)<0&&!ex[2])nos.push(2);
  return nos.map(VID).filter(Boolean);
}
function recLine(r){return r.date+'  키 '+r.h+(r.w?'  몸무게 '+r.w:'')+(r.ba!=null?'  골연령 '+Math.floor(r.ba/12)+'세 '+(r.ba%12)+'개월':'')}
function mergeRecs(oldText,parsed){
  var map={};GR.parsePast(oldText).forEach(function(r){map[r.date]=r});
  parsed.forEach(function(g){
    if(!(g.height>0))return;var o=map[g.date]||{};
    map[g.date]={date:g.date,h:g.height,w:g.weight!=null?g.weight:o.w,ba:g.boneAgeWristMonths!=null?g.boneAgeWristMonths:o.ba};
  });
  return Object.keys(map).sort().slice(-12).map(function(k){return recLine(map[k])}).join('\n');
}
async function callAI(v,g,add,compare,intake,kind){
  var j=await api({action:'generatefirstvisitchart',kind:kind,compare:compare,name:v.name||'',gender:g.sex==='M'?'남':'여',ageText:g.dob?calcAge(g.dob):'',
    intake:intake,chart:add.parts.chart,plan:add.plan,labs:add.labs,extra:add.extra,added:add.text});
  if(j&&j.via==='jarada-codegs'&&j.status==='ok'&&j.data)return{ok:true,data:j.data};
  return{ok:false,old:!(j&&j.via==='jarada-codegs'),msg:(j&&j.message)||''};
}

function syncBar(){

  var m=modelOf(v),ok=!m.error,rev=!!(g&&g.reviewed);
  var s=function(id,fn){var e=document.getElementById(id);if(e)fn(e)};
  s('fr-revbtn',function(e){e.hidden=rev;e.disabled=!ok||!(g&&g.ready)});
  s('fr-unrevbtn',function(e){e.hidden=!rev});
  s('fr-printbtn',function(e){e.disabled=!(ok&&rev);e.title=rev?'':'원장이 [원장 확인 완료]를 누르면 인쇄할 수 있어요.'});

function onEdit(e){
  if(e.target&&e.target.id==='fr-chart')return;
  if(e.target&&e.target.classList&&e.target.classList.contains('frVid')&&e.target.checked&&document.querySelectorAll('.frVid:checked').length>3){e.target.checked=false;toast('영상은 3편까지만 고를 수 있어요.');return}

  clearTimeout(ST.timer);
  ST.timer=setTimeout(function(){ST.timer=null;var g=collect();if(!g)return;commit(g,false);refresh()},450);
}
