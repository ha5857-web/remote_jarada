function close(){
  var pend=ST.timer;clearTimeout(ST.timer);ST.timer=null;
  if(pend&&document.getElementById('grov')){var g=collect();if(g&&V())commit(g,true)}
  var o=document.getElementById('grov');if(o)o.remove();
  document.removeEventListener('keydown',onKey);ST.id=null;
}
function open(id){
  var v=S.items.get(id);if(!v){toast('환자를 찾을 수 없습니다.');return}
  var o0=document.getElementById('grov');if(o0)o0.remove();
  ST.id=id;ST.busy=false;
  var o=document.createElement('div');o.className='grov';o.id='grov';o.innerHTML=shellHtml(v);
  if(!(v.gr&&v.gr.ready))o.classList.add('editing');
  document.body.appendChild(o);
  var g=Object.assign({},v.gr||{});
  if(!g.dob&&v.dob)g.dob=v.dob;if(!g.sex)g.sex=sexOf(v);if(!g.date)g.date=todayStr();
  var it=v.intake||{};if(!g.fh&&it.fatherH)g.fh=it.fatherH;if(!g.mh&&it.motherH)g.mh=it.motherH;
  fillEditor(g);
  if((!g.dob||!g.sex)&&/\d{3,}/.test(v.chartNo||'')){
    api({action:'flowprepare',chartNo:v.chartNo,chart:(v.name||'')+' '+v.chartNo+' 생년월일 성별'}).then(function(pj){
      var idn=pj&&pj.status==='ok'&&pj.source==='patient'&&pj.identity;if(!idn||ST.id!==id)return;
      var d=document.getElementById('fr-dob'),s=document.getElementById('fr-sex');
      if(d&&!d.value&&idn.dob)d.value=String(idn.dob).slice(0,10);
      if(s&&!s.value&&idn.sex)s.value=/^(M|남)/i.test(idn.sex)?'M':/^(F|여)/i.test(idn.sex)?'F':'';
      infoSum();
    }).catch(function(){});
  }
  o.addEventListener('click',function(e){
    var b=e.target.closest('[data-fr]');if(!b||b.disabled)return;var k=b.dataset.fr;
    if(k==='close')close();
    else if(k==='edit'){o.classList.toggle('editing');syncBar();setTimeout(GR.fit,30)}
    else if(k==='print')printFor(ST.id);
    else if(k==='pdf')GR.act('pdf');
    else if(k==='review')setReviewed(true);
    else if(k==='unreview')setReviewed(false);
    else if(k==='ai')run(true);
    else if(k==='noai')run(false);
  });
  o.addEventListener('input',onEdit);o.addEventListener('change',onEdit);
  var ce=document.getElementById('fr-chart');
  if(ce)ce.addEventListener('paste',function(){setTimeout(function(){if(!ST.busy&&String(ce.value||'').trim().length>=150)run(true)},60)});
  document.addEventListener('keydown',onKey);
  window.addEventListener('resize',GR.fit);
  refresh();
  say(v.gr&&v.gr.ready?(v.gr.reviewed?'원장 확인이 끝난 리포트예요. 인쇄하세요.':'원장 확인 전이에요. 내용을 읽고 [원장 확인 완료]를 눌러 주세요.'):'EMR 차트를 붙여넣고 [AI로 정리]를 눌러 주세요.');
  setTimeout(GR.fit,60);
}
function setReviewed(flag){
  var v=V();if(!v)return;var g=collect();if(!g)return;
  if(flag){var m=modelOf(Object.assign({},v,{gr:g}));if(m.error){say(m.error,true);return}}
  g.reviewed=!!flag;g.reviewedAt=flag?Date.now():null;commit(g,true);refresh();
  say(flag?'확인 완료 — 이제 직원이 인쇄할 수 있어요.':'확인을 취소했어요.');
}
async function run(useAI){
  var v=V();if(!v||ST.busy)return;
  var text=String((document.getElementById('fr-chart')||{}).value||'').replace(/\r/g,'').trim();
  if(!text){say('EMR 차트를 먼저 붙여넣어 주세요.',true);return}
  var g0=collect()||{};
  if(hasPost(g0.post)&&!confirm('이미 입력된 내용을 이번 정리 결과로 덮어쓸까요?'))return;
  ST.busy=true;var bb=document.getElementById('fr-aibtn');if(bb)bb.disabled=true;
  say(useAI?'차트를 읽고 AI가 정리하는 중… (10~20초)':'차트를 읽는 중…');
  try{
    var parsed=extractGrowthTableFromNote(text),g=Object.assign({},g0);
    g.recsText=mergeRecs(g0.recsText||'',parsed);
    if(!g.dob)g.dob=v.dob||findDob(text)||'';
    if(!g.sex)g.sex=sexOf(v);
    if((!g.dob||!g.sex)&&/\d{3,}/.test(v.chartNo||'')){
      try{
        var pj=await api({action:'flowprepare',chartNo:v.chartNo,chart:text.slice(0,6000)});
        var idn=pj&&pj.status==='ok'&&pj.source==='patient'&&pj.identity;
        if(idn){if(!g.dob&&idn.dob)g.dob=String(idn.dob).slice(0,10);if(!g.sex&&idn.sex)g.sex=/^(M|남)/i.test(idn.sex)?'M':/^(F|여)/i.test(idn.sex)?'F':''}
      }catch(e){}
    }
    if(!g.date)g.date=todayStr();
    var par=findParents(text);if(!g.fh&&par.fh)g.fh=par.fh;if(!g.mh&&par.mh)g.mh=par.mh;
    var add=splitAdded(text),draft=localDraft(text,add,g.date),A=null,warn='';
    if(useAI){
      var ai;
      try{ai=await callAI(v,g,add,compareText(parsed),(v.first&&!v.rev)?[v.intake&&v.intake.chief,v.intake&&v.intake.history,v.intake&&v.intake.signs].filter(Boolean).join('\n').slice(0,3000):'',(v.first&&!v.rev)?'first':'revisit')}
      catch(e){ai={ok:false,msg:(e&&e.code==='AUTH_REQUIRED')?'로그인이 필요합니다':'연결 오류'}}
      if(ai.ok)A=ai.data;else warn=(ai.old?'서버(Code.gs)에 AI 기능이 없어요':'AI 정리 실패'+(ai.msg?': '+ai.msg:''))+' — AI 없이 정리한 초안이에요.';
    }
    var pick=function(k,fb){return(A&&A[k]&&String(A[k]).trim())?String(A[k]).trim():(fb||'')};
    var shim={diagnosis:'',notes:text,firstVisit:{post:{summary:''}}};
    g.post={summary:pick('summary',draft.summary),labs:pick('labs',draft.labs),xray:pick('xray',draft.xray),direction:pick('direction',draft.direction),
      exercise:pick('exercise',fvLifestyleDraft('exercise',shim)),nutrition:pick('nutrition',fvLifestyleDraft('nutrition',shim)),sleep:pick('sleep',fvLifestyleDraft('sleep',shim)),
      nextDate:draft.nextDate||'',tests:draft.tests||[],videos:pickVideos(add.text||text,v.vids)};
    g.reviewed=false;g.reviewedAt=null;g.ai=!!A;
    commit(g,true);fillEditor(g);refresh();
    var m=modelOf(V()),notes=[];
    if(m.error)notes.push(m.error);
    say((A?'✅ AI가 정리했어요':'✅ 정리했어요(AI 없이)')+' — 읽고 고친 뒤 [원장 확인 완료]를 눌러 주세요.'+(warn?' · '+warn:'')+(notes.length?' · '+notes.join(' '):''),!!(warn||notes.length));
  }catch(e){say('정리하지 못했어요: '+((e&&e.message)||'차트 형식을 확인해 주세요'),true)}
  finally{ST.busy=false;var b2=document.getElementById('fr-aibtn');if(b2)b2.disabled=false}
}

function listHtml(){
  var a=list().filter(function(v){return v.step>=0||(v.gr&&v.gr.ready)});
  var rank=function(v){var g=v.gr;return g&&g.ready?(g.reviewed?0:1):2};
  a.sort(function(x,y){var r=rank(x)-rank(y);if(r)return r;return rank(x)<2?((y.gr.at||0)-(x.gr.at||0)):((y.createdAt||0)-(x.createdAt||0))});
  if(!a.length)return '<div class="empty"><h2>오늘 등록된 환자가 없습니다</h2><p>환자가 등록되면 여기에서 성장 리포트를 만들고 인쇄할 수 있어요.</p></div>';
  var ready=a.filter(function(v){return v.gr&&v.gr.ready&&v.gr.reviewed}).length;
  var rows=a.map(function(v){
    var g=v.gr,st,bt;
    if(g&&g.ready&&g.reviewed){st='<span class="pill ok">인쇄 가능</span>';bt='<button class="btn sm primary" data-act="gr-print" data-id="'+v.id+'">🖨 인쇄</button><button class="btn sm" data-act="gr-open" data-id="'+v.id+'">미리보기</button>'}
    else if(g&&g.ready){st='<span class="pill warn">원장 확인 전</span>';bt='<button class="btn sm" data-act="gr-open" data-id="'+v.id+'">열어서 확인</button>'}
    else{st='<span class="pill ex">리포트 없음</span>';bt='<button class="btn sm" data-act="gr-open" data-id="'+v.id+'">차트 붙여넣어 만들기</button>'}
    return '<div class="frrow"><div class="frnm"><b>'+esc(v.name||'이름 없음')+'</b><span class="meta">'+esc(age(v))+(v.sex?' · '+esc(v.sex):'')+(v.chartNo?' · '+esc(v.chartNo):'')+'</span></div><div>'+st+'</div><div class="frbt">'+bt+'</div></div>';
  }).join('');
  return '<h3 style="margin:0 0 4px">성장 리포트</h3><p class="hint" style="margin:0 0 10px">원장이 환자별로 EMR 차트를 붙여넣어 리포트를 만들고 <b>원장 확인 완료</b>를 누르면, 이 화면에서 직원이 인쇄합니다. (지금 인쇄 가능 <b>'+ready+'</b>건)</p>'+rows;
}
return{open:open,close:close,listHtml:listHtml,print:printFor};
})();
</script>
